# /etc/nginx/sites-available/ciaa-api.conf
# TLS-terminating reverse proxy for the CIAA backend API.
# nginx is the ONLY public listener; gunicorn binds 127.0.0.1:8080.

server {
    listen 80;
    server_name api.yourdomain.com;
    return 301 https://$host$request_uri;          # force HTTPS
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.yourdomain.com;

    ssl_certificate     /etc/letsencrypt/live/api.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.yourdomain.com/privkey.pem;

    # Diffs can be a few MB (MAX_DIFF_BYTES default 5 MB) — allow headroom.
    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A full analysis can run for minutes — keep the proxy from timing out
        # before the backend's own analysis_timeout_s (default 600s).
        proxy_read_timeout 660s;
        proxy_send_timeout 660s;
    }
}
