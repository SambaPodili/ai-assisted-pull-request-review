# /etc/nginx/sites-available/ciaa-frontend.conf
# Serves the built frontend (frontend/dist) as static files. Deploy on its own
# host/domain, separate from the API. (Or use any static host / CDN instead.)

server {
    listen 80;
    server_name app.yourdomain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name app.yourdomain.com;

    ssl_certificate     /etc/letsencrypt/live/app.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.yourdomain.com/privkey.pem;

    root /var/www/ciaa-frontend;        # contents of frontend/dist
    index index.html;

    # SPA: fall back to index.html for client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache the hashed asset bundles.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
