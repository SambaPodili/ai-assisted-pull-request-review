# ──────────────────────────────────────────────────────────────────────────────
# Secret — sensitive credentials. Do NOT commit real values to git.
# Create from the CLI instead (see DEPLOYMENT.md) or `oc apply` after editing.
# ──────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: impact-analyzer-secret
  labels:
    app: impact-analyzer
type: Opaque
stringData:
  # LLM provider key (Anthropic by default)
  ANTHROPIC_API_KEY: ""
  # Git provider token (for PR diff fetch + auto-clone reference search)
  GITHUB_TOKEN: ""
  GITHUB_WEBHOOK_SECRET: ""
  # CIAA API keys — JSON array of role objects (see config/keys.json)
  API_KEYS: '[{"key":"REPLACE_ME","roles":["admin"],"name":"Platform Admin"}]'
  # Optional: SMTP for the daily digest
  SMTP_PASSWORD: ""
