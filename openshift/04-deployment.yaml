# ──────────────────────────────────────────────────────────────────────────────
# Deployment — the CIAA Impact Analyzer API + frontend.
# Single self-contained pod: SQLite report store + in-memory fallbacks.
# ──────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: impact-analyzer
  labels:
    app: impact-analyzer
spec:
  replicas: 1                     # SQLite store is single-writer; keep at 1
  selector:                       # (use Redis + scale up for HA — see DEPLOYMENT.md)
    matchLabels:
      app: impact-analyzer
  strategy:
    type: Recreate                # avoid two pods sharing the RWO volume
  template:
    metadata:
      labels:
        app: impact-analyzer
    spec:
      # No runAsUser — let OpenShift assign a UID from the project's range.
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: impact-analyzer
          image: image-registry.openshift-image-registry.svc:5000/REPLACE_NAMESPACE/impact-analyzer:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: impact-analyzer-config
            - secretRef:
                name: impact-analyzer-secret
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: logs
              mountPath: /app/logs
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          # /live → process up;  /ready → dependencies reachable
          livenessProbe:
            httpGet:
              path: /live
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: impact-analyzer-data
        - name: logs
          emptyDir: {}
