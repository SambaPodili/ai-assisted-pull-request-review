# vscode-extension/package.json's version is the source of truth for feature
# parity milestones — keep this in step with it (see CHANGELOG.md here).
pluginVersion = 0.2.1
pluginGroup = com.uob.gto

# IntelliJ Platform target — Community 2022.3 (build 223) as the floor, to
# support developers on an older IDE install. Compiled directly against this
# version's real SDK jars (not just declared compatible) so a real API
# absence fails the build here, not at runtime on someone's machine — see
# build.gradle.kts's `ideaVersion { sinceBuild }` for the matching floor.
platformType = IC
platformVersion = 2022.3.3

# false is REQUIRED, not just a style choice — IntelliJ Platform bundles its
# own Kotlin stdlib; a project-declared one conflicts at runtime (flagged by
# `gradle verifyPluginProjectConfiguration`). See:
# https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency = false
org.gradle.java.installations.auto-download = true
# Homebrew's openjdk@17 is keg-only (not symlinked into
# /Library/Java/JavaVirtualMachines, so /usr/libexec/java_home can't find it
# without sudo) — list it explicitly so Gradle's toolchain resolution can
# still use it. Remove if the machine gets a properly-registered JDK 17.
org.gradle.java.installations.paths = /opt/homebrew/opt/openjdk@17/libexec/openjdk.jdk/Contents/Home
# The Gradle daemon's own JVM matters too, separate from the compile
# toolchain above — Kotlin 1.9.22's compiler can't parse a JDK 26 version
# string (JavaVersion.parse throws), so the daemon itself must also run on 17.
org.gradle.java.home = /opt/homebrew/opt/openjdk@17/libexec/openjdk.jdk/Contents/Home
