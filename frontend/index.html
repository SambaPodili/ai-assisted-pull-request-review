<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Impact Analyzer — AI Code Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.11.0/tabler-icons.min.css"/>
<style>
  :root {
    --bg: #f7f8fa; --surface: #ffffff; --card: #ffffff; --border: #e8eaed;
    --text: #c9d4e8; --text-dim: #4a5b7a; --text-bright: #e8f0ff;
    --accent: #3b82f6; --accent-dim: #1e3a5f; --accent-bright: #60a5fa;
    --green: #10b981; --green-dim: #064e3b; --green-bright: #34d399;
    --amber: #f59e0b; --amber-dim: #451a03; --amber-bright: #fbbf24;
    --red: #ef4444; --red-dim: #450a0a; --red-bright: #f87171;
    --mono: 'JetBrains Mono', monospace; --sans: 'Instrument Sans', sans-serif;
    --r: 8px; --rl: 12px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #f7f8fa; color: #0d1117; font-family: var(--sans); font-size: 14px; }
  body { display: flex; flex-direction: column; min-height: 100vh; }

  /* Layout */
  .shell { display: flex; height: 100vh; overflow: hidden; }
  .sidebar { width: 220px; flex-shrink: 0; background: #ffffff; border-right: 1px solid #e8eaed; display: flex; flex-direction: column; padding: 20px 0; }
  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .topbar { height: 52px; border-bottom: 1px solid #e8eaed; display: flex; align-items: center; padding: 0 24px; gap: 12px; background: #ffffff; flex-shrink: 0; }
  .content { flex: 1; overflow-y: auto; padding: 24px; }

  /* Sidebar */
  .brand { padding: 0 20px 24px; display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 600; color: #0d1117; border-bottom: 1px solid #e8eaed; margin-bottom: 12px; }
  .brand i { font-size: 22px; color: #1a6cf6; }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 20px; font-size: 13px; color: #7a8494; cursor: pointer; transition: all 0.15s; border-left: 3px solid transparent; }
  .nav-item:hover { color: #0d1117; background: #ffffff; }
  .nav-item.active { color: #1a6cf6; background: #eff5ff; border-left-color: #1a6cf6; }
  .nav-item i { font-size: 17px; }
  .nav-section { font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; color: #7a8494; padding: 16px 20px 6px; font-weight: 500; }
  .conn-indicator { margin: auto 0 0; padding: 12px 20px; border-top: 1px solid #e8eaed; font-size: 12px; color: #7a8494; }
  .conn-dot { width: 8px; height: 8px; border-radius: 50%; background: #e8eaed; display: inline-block; margin-right: 6px; }
  .conn-dot.ok { background: var(--green); box-shadow: 0 0 6px var(--green); }

  /* Cards */
  .card { background: #ffffff; border: 1px solid #e8eaed; border-radius: var(--rl); padding: 20px; margin-bottom: 16px; }
  .card-title { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: #7a8494; margin-bottom: 16px; display: flex; align-items: center; gap: 7px; }
  .card-title i { font-size: 15px; }

  /* Forms */
  label { display: block; font-size: 12px; color: #7a8494; margin-bottom: 5px; font-weight: 500; }
  input[type="text"], input[type="password"], input[type="url"], select, textarea {
    width: 100%; background: #ffffff; border: 1px solid #e8eaed; border-radius: var(--r);
    color: #0d1117; font-family: var(--sans); font-size: 13px; padding: 8px 12px;
    transition: border-color 0.15s; outline: none;
  }
  input[type="text"]:focus, input[type="password"]:focus, input[type="url"]:focus, select:focus, textarea:focus { border-color: #1a6cf6; }
  input[type="text"]::placeholder, input[type="password"]::placeholder, textarea::placeholder { color: #7a8494; }
  select option { background: #ffffff; }
  .field { margin-bottom: 14px; }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .three-col { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
  .field-hint { font-size: 11px; color: #7a8494; margin-top: 4px; }
  .field-hint a { color: #1a6cf6; text-decoration: none; }

  /* Radio pills */
  .pill-group { display: flex; gap: 8px; flex-wrap: wrap; }
  .pill { display: flex; align-items: center; gap: 7px; padding: 7px 14px; border: 1px solid #e8eaed; border-radius: 20px; cursor: pointer; font-size: 13px; color: #7a8494; transition: all 0.15s; user-select: none; }
  .pill:hover { border-color: #1a6cf6; color: #0d1117; }
  .pill.selected { border-color: #1a6cf6; background: #eff5ff; color: #1a6cf6; }
  .pill i { font-size: 16px; }

  /* Buttons */
  .btn { display: inline-flex; align-items: center; gap: 7px; padding: 8px 16px; border: 1px solid #e8eaed; border-radius: var(--r); cursor: pointer; font-size: 13px; font-family: var(--sans); font-weight: 500; transition: all 0.15s; background: transparent; color: #0d1117; }
  .btn:hover:not(:disabled) { background: #ffffff; border-color: #1a6cf6; color: #1a6cf6; }
  .btn:active:not(:disabled) { transform: scale(0.98); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-primary { background: #1a6cf6; border-color: #1a6cf6; color: #fff; }
  .btn-primary:hover:not(:disabled) { background: #1a6cf6; border-color: #1a6cf6; color: #fff; }
  .btn-success { background: #edfaf3; border-color: var(--green); color: #0c7c4b; }
  .btn-danger { background: #fff1f1; border-color: var(--red); color: #b81c1c; }
  .btn-sm { padding: 5px 10px; font-size: 12px; }
  .btn-icon { width: 32px; height: 32px; padding: 0; justify-content: center; }

  /* Steps */
  .steps-row { display: flex; align-items: center; gap: 0; margin-bottom: 24px; }
  .step-item { display: flex; align-items: center; gap: 8px; }
  .step-circle { width: 26px; height: 26px; border-radius: 50%; border: 1px solid #e8eaed; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 500; color: #7a8494; flex-shrink: 0; transition: all 0.2s; }
  .step-circle.active { border-color: #1a6cf6; background: #1a6cf6; color: #fff; }
  .step-circle.done { border-color: var(--green); background: #edfaf3; color: #0c7c4b; }
  .step-label { font-size: 12px; color: #7a8494; white-space: nowrap; }
  .step-label.active { color: #0d1117; font-weight: 500; }
  .step-label.done { color: #0c7c4b; }
  .step-line { flex: 1; height: 1px; background: #e8eaed; margin: 0 10px; min-width: 20px; }
  .step-line.done { background: var(--green); }

  /* Repo grid */
  .repo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; max-height: 300px; overflow-y: auto; padding: 2px; }
  .repo-tile { background: #ffffff; border: 1px solid #e8eaed; border-radius: var(--r); padding: 10px 12px; cursor: pointer; transition: all 0.15s; }
  .repo-tile:hover { border-color: #1a6cf6; }
  .repo-tile.primary { border-color: var(--green); background: #edfaf3; }
  .repo-tile.connected { border-color: #1a6cf6; background: #eff5ff; }
  .repo-tile-name { font-size: 12px; font-weight: 500; color: #0d1117; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .repo-tile.primary .repo-tile-name { color: #0c7c4b; }
  .repo-tile.connected .repo-tile-name { color: #1a6cf6; }
  .repo-tile-meta { font-size: 11px; color: #7a8494; margin-top: 4px; display: flex; align-items: center; gap: 5px; }
  .lang-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

  /* List items */
  .list-item { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border: 1px solid #e8eaed; border-radius: var(--r); margin-bottom: 6px; cursor: pointer; transition: all 0.15s; background: #ffffff; }
  .list-item:hover { border-color: #1a6cf6; }
  .list-item.selected { border-color: #1a6cf6; background: #eff5ff; }
  .list-item .li-main { flex: 1; min-width: 0; }
  .list-item .li-title { font-size: 13px; font-weight: 500; color: #0d1117; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .list-item.selected .li-title { color: #1a6cf6; }
  .list-item .li-sub { font-size: 11px; color: #7a8494; margin-top: 2px; }
  .list-scroll { max-height: 280px; overflow-y: auto; }

  /* Tabs */
  .tabs { display: flex; gap: 2px; border-bottom: 1px solid #e8eaed; margin-bottom: 18px; }
  .tab { padding: 8px 16px; font-size: 13px; cursor: pointer; color: #7a8494; border-bottom: 2px solid transparent; margin-bottom: -1px; font-family: var(--sans); background: none; border-top: none; border-left: none; border-right: none; transition: all 0.15s; }
  .tab:hover { color: #0d1117; }
  .tab.active { color: #1a6cf6; border-bottom-color: #1a6cf6; }

  /* Badges */
  .badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: 12px; border: 1px solid; }
  .badge-green { background: #edfaf3; color: #0c7c4b; border-color: var(--green); }
  .badge-amber { background: #fff8ec; color: #8a5200; border-color: #8a5200; }
  .badge-red { background: #fff1f1; color: #b81c1c; border-color: var(--red); }
  .badge-blue { background: #eff5ff; color: #1a6cf6; border-color: #1a6cf6; }
  .badge-dim { background: #ffffff; color: #7a8494; border-color: #e8eaed; }

  /* Gate banner */
  .gate-banner { border-radius: var(--rl); padding: 18px 22px; display: flex; align-items: center; gap: 16px; margin-bottom: 18px; border: 1px solid; }
  .gate-approve { background: #edfaf3; border-color: var(--green); }
  .gate-hold { background: #fff8ec; border-color: #8a5200; }
  .gate-block { background: #fff1f1; border-color: var(--red); }
  .gate-icon { font-size: 32px; flex-shrink: 0; }
  .gate-approve .gate-icon { color: #0c7c4b; }
  .gate-hold .gate-icon { color: #8a5200; }
  .gate-block .gate-icon { color: #b81c1c; }
  .gate-title { font-size: 18px; font-weight: 600; }
  .gate-approve .gate-title { color: #0c7c4b; }
  .gate-hold .gate-title { color: #8a5200; }
  .gate-block .gate-title { color: #b81c1c; }
  .gate-sub { font-size: 13px; color: #7a8494; margin-top: 4px; line-height: 1.5; }

  /* Metrics grid */
  .metrics-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin-bottom: 18px; }
  .metric { background: #ffffff; border: 1px solid #e8eaed; border-radius: var(--r); padding: 12px 14px; }
  .metric-label { font-size: 11px; color: #7a8494; margin-bottom: 6px; }
  .metric-value { font-size: 22px; font-weight: 600; color: #0d1117; font-family: var(--mono); }

  /* Findings */
  .finding { display: flex; align-items: flex-start; gap: 10px; padding: 10px 0; border-bottom: 1px solid #e8eaed; }
  .finding:last-child { border-bottom: none; }
  .finding-body { flex: 1; min-width: 0; }
  .finding-desc { font-size: 13px; color: #0d1117; }
  .finding-file { font-size: 11px; color: #7a8494; font-family: var(--mono); margin-top: 3px; }
  .code-snippet { margin-top:7px; border-radius:6px; overflow:hidden; border:1px solid #e8eaed; font-family:var(--mono); font-size:11.5px; line-height:1.5; }
  .code-snippet-line { display:flex; min-width:0; }
  .code-snippet-line.add { background:#edfaf3; }
  .code-snippet-line.del { background:#fff1f1; }
  .code-snippet-line.ctx { background:#f7f8fa; }
  .code-snippet-ln { min-width:36px; text-align:right; padding:1px 6px; color:#9fadbf; flex-shrink:0; user-select:none; border-right:1px solid #e8eaed; }
  .code-snippet-line.add .code-snippet-ln { background:#d1fae5; color:#0c7c4b; }
  .code-snippet-line.del .code-snippet-ln { background:#ffe4e6; color:#b81c1c; }
  .code-snippet-content { padding:1px 8px; white-space:pre; overflow-x:auto; flex:1; }
  .sev { font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 10px; flex-shrink: 0; margin-top: 2px; text-transform: uppercase; letter-spacing: 0.05em; border: 1px solid; }
  .sev-critical { background: #fff1f1; color: #b81c1c; border-color: var(--red); }
  .sev-high { background: #fff8ec; color: #8a5200; border-color: #8a5200; }
  .sev-medium { background: #eff5ff; color: #1a6cf6; border-color: #1a6cf6; }
  .sev-low { background: #ffffff; color: #7a8494; border-color: #e8eaed; }

  /* Misc */
  .spinner { width: 18px; height: 18px; border: 2px solid #e8eaed; border-top-color: #1a6cf6; border-radius: 50%; animation: spin 0.7s linear infinite; display: inline-block; flex-shrink: 0; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .progress-bar { height: 3px; background: #e8eaed; border-radius: 2px; overflow: hidden; }
  .progress-fill { height: 100%; background: #1a6cf6; border-radius: 2px; transition: width 0.4s; }
  .search-wrap { position: relative; margin-bottom: 12px; }
  .search-wrap i { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: #7a8494; font-size: 16px; pointer-events: none; }
  .search-wrap input { padding-left: 34px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; padding: 3px 10px; border-radius: 14px; background: #eff5ff; color: #1a6cf6; border: 1px solid #1a6cf6; }
  .chip button { background: none; border: none; cursor: pointer; color: inherit; padding: 0; font-size: 14px; line-height: 1; display: flex; }
  .info-msg { font-size: 12px; background: #ffffff; border: 1px solid #e8eaed; border-radius: var(--r); padding: 8px 12px; color: #7a8494; display: flex; align-items: center; gap: 7px; margin-bottom: 12px; }
  .err-msg { font-size: 13px; background: #fff1f1; border: 1px solid var(--red); border-radius: var(--r); padding: 10px 14px; color: #b81c1c; display: flex; align-items: flex-start; gap: 8px; margin-bottom: 14px; }
  .footer-bar { display: flex; align-items: center; justify-content: space-between; padding: 14px 24px; border-top: 1px solid #e8eaed; background: #ffffff; flex-shrink: 0; }
  .section-heading { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: #7a8494; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
  .section-heading i { font-size: 14px; }
  .score-bar { height: 6px; background: #ffffff; border-radius: 3px; overflow: hidden; width: 100%; margin-top: 6px; }
  .score-fill { height: 100%; border-radius: 3px; }
  code { font-family: var(--mono); font-size: 11px; background: #ffffff; padding: 1px 5px; border-radius: 4px; border: 1px solid #e8eaed; color: #1a6cf6; }
  .empty-state { text-align: center; padding: 40px 20px; color: #7a8494; }
  .empty-state i { font-size: 36px; display: block; margin-bottom: 10px; opacity: 0.4; }
  .history-item { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border: 1px solid #e8eaed; border-radius: var(--r); margin-bottom: 6px; background: #ffffff; cursor: pointer; transition: all 0.15s; }
  .history-item:hover { border-color: #1a6cf6; }
  a { color: #1a6cf6; text-decoration: none; }
  a:hover { text-decoration: underline; }
  .topbar-title { font-size: 14px; font-weight: 500; color: #0d1117; }
  .topbar-sub { font-size: 12px; color: #7a8494; }
  .scrollable { overflow-y: auto; }
  .checklist-item { display: flex; align-items: flex-start; gap: 8px; padding: 6px 0; border-bottom: 1px solid #e8eaed; font-size: 13px; }
  .checklist-item:last-child { border-bottom: none; }
  .checklist-item i { font-size: 15px; color: #7a8494; flex-shrink: 0; margin-top: 1px; }

/* ── Professional Light Theme Overrides ── */
html, body { font-family: 'Instrument Sans', sans-serif; background: #f7f8fa; color: #0d1117; }
.shell { height: 100vh; }
.sidebar { background: #ffffff; border-right: 1px solid #e8eaed; }
.main { background: #f7f8fa; }
.topbar { background: #ffffff; border-bottom: 1px solid #e8eaed; }

/* Brand */
.brand { padding: 18px 20px; border-bottom: 1px solid #e8eaed; }
.brand i { color: #0d1117; }
.brand-text { font-family: 'Instrument Serif', serif; font-size: 16px; color: #0d1117; letter-spacing: -.01em; }

/* Gate banners in light theme */  
.gate-approve { background: #edfaf3; border-color: #b5e8cf; }
.gate-hold { background: #fff8ec; border-color: #fad98a; }
.gate-block { background: #fff1f1; border-color: #f8c0c0; }
.gate-approve .gate-title { color: #0c7c4b; }
.gate-hold .gate-title { color: #8a5200; }
.gate-block .gate-title { color: #b81c1c; }

/* Metrics cards */
.metric { background: #ffffff; border: 1px solid #e8eaed; }
.metric-label { color: #7a8494; }

/* Repo tiles */
.repo-tile { background: #ffffff; border: 1.5px solid #e8eaed; }
.repo-tile:hover { border-color: #3d4652; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
.repo-tile.primary { border-color: #0c7c4b; background: #edfaf3; }
.repo-tile.connected { border-color: #1a6cf6; background: #eff5ff; }

/* List items */
.list-item { background: #ffffff; border: 1.5px solid #e8eaed; }
.list-item.selected { border-color: #1a6cf6; background: #eff5ff; }
.list-item:hover { border-color: #3d4652; }

/* Nav items */
.nav-item.active { background: #eff5ff; border-left-color: #1a6cf6; color: #1a6cf6; }
.nav-item:hover { background: #f7f8fa; }

/* Buttons */
.btn { background: #ffffff; border: 1.5px solid #e8eaed; color: #0d1117; }
.btn:hover:not(:disabled) { background: #f7f8fa; border-color: #3d4652; }
.btn-primary { background: #0d1117; color: #ffffff; border-color: #0d1117; }
.btn-primary:hover:not(:disabled) { background: #1e2530; color: #ffffff; }
.btn-blue { background: #1a6cf6; color: #ffffff; border-color: #1a6cf6; }

/* Input fields */
input, select { background: #ffffff; border: 1.5px solid #e8eaed; color: #0d1117; }
input:focus, select:focus { border-color: #1a6cf6; box-shadow: 0 0 0 3px rgba(26,108,246,.08); }

/* Cards */
.card { background: #ffffff; border: 1px solid #e8eaed; box-shadow: 0 1px 3px rgba(0,0,0,.04); }

/* Steps */
.step-num.active { background: #0d1117; border-color: #0d1117; color: #ffffff; }
.step-num.done { background: #0c7c4b; border-color: #0c7c4b; color: #ffffff; }
.step-line.done { background: #0c7c4b; }
.step-label.active { color: #0d1117; font-weight: 600; }
.step-label.done { color: #0c7c4b; }

/* Severity badges */
.sev-critical, .sev-CRITICAL { background: #fff1f1; color: #b81c1c; border: 1px solid #f8c0c0; }
.sev-high, .sev-HIGH { background: #fff8ec; color: #8a5200; border: 1px solid #fad98a; }
.sev-medium, .sev-MEDIUM { background: #eff5ff; color: #1a6cf6; border: 1px solid #c2d6fe; }
.sev-low, .sev-LOW, .sev-gap { background: #f7f8fa; color: #7a8494; border: 1px solid #e8eaed; }

/* Spinner in light mode */
.spinner { border-color: #e8eaed; border-top-color: #1a6cf6; }

/* Code elements */
code { background: #f7f8fa; border: 1px solid #e8eaed; color: #1a6cf6; }

/* Chip colors */
.chip-blue { background: #eff5ff; color: #1a6cf6; border-color: #c2d6fe; }
.chip-green { background: #edfaf3; color: #0c7c4b; border-color: #b5e8cf; }
.chip-amber { background: #fff8ec; color: #8a5200; border-color: #fad98a; }
.chip-red { background: #fff1f1; color: #b81c1c; border-color: #f8c0c0; }
.chip-dim { background: #f7f8fa; color: #7a8494; border-color: #e8eaed; }

/* Provider tiles */
.provider-tile { border: 1.5px solid #e8eaed; background: #ffffff; }
.provider-tile:hover { border-color: #3d4652; }
.provider-tile.selected { border-color: #1a6cf6; background: #eff5ff; }
.provider-tile.selected .pt-icon { color: #1a6cf6; }
.provider-tile.selected .pt-label { color: #1a6cf6; }
.provider-tile .pt-check { background: #1a6cf6; }

/* Auth tabs */
.auth-tab { border: 1.5px solid #e8eaed; background: #ffffff; color: #3d4652; }
.auth-tab.active { background: #0d1117; border-color: #0d1117; color: #ffffff; }
.auth-tab:hover:not(.active) { border-color: #3d4652; }

/* Info messages */
.info-msg { background: #eff5ff; border-color: #c2d6fe; color: #3d4652; }
.err-msg { background: #fff1f1; border-color: #f8c0c0; color: #b81c1c; }
.success-msg { background: #edfaf3; border-color: #b5e8cf; color: #0c7c4b; }

/* Score bars */
.score-bar-bg { background: #f1f3f5; }

/* Footer */
.footer-bar { background: #ffffff; border-top: 1px solid #e8eaed; }

/* Progress */
.progress-bar { background: #e8eaed; }
.progress-fill { background: #1a6cf6; }

/* Conn indicator */
.conn-dot.ok { background: #22c55e; box-shadow: 0 0 0 3px rgba(34,197,94,.15); }
.conn-indicator { border-top: 1px solid #e8eaed; }

/* Gate banner text */
.gate-icon { font-size: 28px; }
.gate-approve .gate-icon { color: #0c7c4b; }
.gate-hold .gate-icon { color: #8a5200; }
.gate-block .gate-icon { color: #b81c1c; }

/* History rows */
.history-item { background: #ffffff; border: 1px solid #e8eaed; }
.history-item:hover { border-color: #3d4652; box-shadow: 0 2px 8px rgba(0,0,0,.04); }

/* Tabs */
.tab-btn.active { color: #0d1117; border-bottom-color: #0d1117; }

/* Typography improvements */
h1, h2, h3 { font-family: 'Instrument Serif', serif; }
.gate-title { font-family: 'Instrument Serif', serif; font-size: 20px; letter-spacing: -.02em; }
.metric-value { font-family: 'JetBrains Mono', monospace; }
.brand-name-text { font-family: 'Instrument Serif', serif; }

/* Live agent pipeline */
.pipeline-phase { font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:#9fadbf;font-weight:600;padding:10px 0 5px;display:flex;align-items:center;gap:8px }
.pipeline-phase::after { content:'';flex:1;height:1px;background:#e8eaed }
.agent-row { display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;border:1px solid #e8eaed;background:#fff;transition:all .2s;margin-bottom:5px }
.agent-row.running { border-color:#bfdbfe;background:#eff6ff }
.agent-row.done    { border-color:#bbf7d0;background:#f0fdf4 }
.agent-row.fallback{ border-color:#fde68a;background:#fffbeb }
.agent-row.skipped { opacity:.45 }
.agent-dot { width:9px;height:9px;border-radius:50%;flex-shrink:0 }
.agent-dot.pending  { background:#d1d5db }
.agent-dot.running  { background:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.25);animation:pulse-dot 1.2s infinite }
.agent-dot.done     { background:#10b981 }
.agent-dot.fallback { background:#f59e0b }
.agent-dot.skipped  { background:#d1d5db }
@keyframes pulse-dot { 0%,100%{box-shadow:0 0 0 3px rgba(59,130,246,.25)} 50%{box-shadow:0 0 0 6px rgba(59,130,246,.08)} }
.agent-name { font-size:13px;font-weight:500;flex:1;color:#0d1117 }
.agent-name.pending  { color:#7a8494;font-weight:400 }
.agent-badge { font-size:10px;border-radius:10px;padding:2px 8px;font-weight:500;flex-shrink:0 }
.agent-badge.running  { background:#dbeafe;color:#1e40af }
.agent-badge.done     { background:#dcfce7;color:#15803d }
.agent-badge.fallback { background:#fef3c7;color:#92400e }
.agent-badge.pending  { background:#f1f5f9;color:#94a3b8 }
.agent-stat { font-family:'JetBrains Mono',monospace;font-size:12px;color:#0d1117;font-weight:600;min-width:44px;text-align:right;flex-shrink:0 }
.agent-stat.dim { color:#9fadbf;font-weight:400 }
.agent-tok  { font-family:'JetBrains Mono',monospace;font-size:11px;color:#7a8494;min-width:70px;text-align:right;flex-shrink:0 }
.agent-bar  { width:60px;height:5px;background:#e8eaed;border-radius:3px;overflow:hidden;flex-shrink:0 }
.agent-bar-fill { height:100%;border-radius:3px;transition:width .5s ease }

</style>
</head>
<body>
<div class="shell">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="brand"><i class="ti ti-microscope"></i>Impact Analyzer</div>

    <div class="nav-section">Analysis</div>
    <div class="nav-item active" onclick="showView('configure')" id="nav-configure">
      <i class="ti ti-plug-connected"></i>Configure
    </div>
    <div class="nav-item" onclick="showView('repos')" id="nav-repos">
      <i class="ti ti-folder"></i>Repositories
    </div>
    <div class="nav-item" onclick="showView('target')" id="nav-target">
      <i class="ti ti-target"></i>Analysis target
    </div>
    <div class="nav-item" onclick="showView('results')" id="nav-results">
      <i class="ti ti-chart-bar"></i>Results
    </div>

    <div class="nav-section">History</div>
    <div class="nav-item" onclick="showView('history')" id="nav-history">
      <i class="ti ti-history"></i>Past analyses
    </div>

    <div class="nav-section">Validation</div>
    <div class="nav-item" onclick="showView('quality')" id="nav-quality">
      <i class="ti ti-target-arrow"></i>Quality metrics
    </div>

    <div class="nav-section">Settings</div>
    <div class="nav-item" onclick="showView('settings')" id="nav-settings">
      <i class="ti ti-settings"></i>Backend config
    </div>

    <div class="conn-indicator" id="conn-indicator">
      <span class="conn-dot" id="conn-dot"></span>
      <span id="conn-text">Not connected</span>
    </div>
  </aside>

  <!-- Main -->
  <div class="main">
    <div class="topbar">
      <div>
        <div class="topbar-title" id="topbar-title">Configure provider</div>
        <div class="topbar-sub" id="topbar-sub">Connect your Git provider to begin</div>
      </div>
      <div style="margin-left:auto;display:flex;align-items:center;gap:10px">
        <span id="topbar-badge"></span>
        <a id="backend-url-display" href="#" style="font-size:11px;color:#7a8494" onclick="showView('settings');return false;"></a>
      </div>
    </div>

    <!-- Views -->
    <div id="view-configure" class="content"></div>
    <div id="view-repos" class="content" style="display:none"></div>
    <div id="view-target" class="content" style="display:none"></div>
    <div id="view-results" class="content" style="display:none"></div>
    <div id="view-history" class="content" style="display:none"></div>
    <div id="view-settings" class="content" style="display:none"></div>
    <div id="view-quality" class="content" style="display:none"></div>

    <div class="footer-bar" id="footer-bar" style="display:none">
      <button class="btn" id="btn-back" onclick="goBack()"><i class="ti ti-arrow-left"></i>Back</button>
      <button class="btn btn-primary" id="btn-next" onclick="goNext()">Continue <i class="ti ti-arrow-right"></i></button>
    </div>
  </div>
</div>

<script>
// ── State ────────────────────────────────────────────────────────────────────
const state = {
  step: 0,
  // Provider: github | github_enterprise | bitbucket | bitbucket_server
  provider: localStorage.getItem('provider') || 'github',
  authMode: localStorage.getItem('authMode') || 'token',
  token: localStorage.getItem('token') || '',
  username: localStorage.getItem('username') || '',
  password: '',  // never persisted
  workspace: localStorage.getItem('workspace') || '',
  baseUrl: localStorage.getItem('baseUrl') || '',  // enterprise/server base URL
  useProxy: true,  // always use backend proxy (solves CORS for all providers)
  userInfo: null,
  backendUrl: localStorage.getItem('backendUrl') || 'http://localhost:8080',
  backendKey: localStorage.getItem('backendKey') || '',
  modelProvider: localStorage.getItem('modelProvider') || 'anthropic',
  modelName:     localStorage.getItem('modelName')     || 'claude-sonnet-4-6',
  modelApiKey:   localStorage.getItem('modelApiKey')   || '',
  modelBaseUrl:  localStorage.getItem('modelBaseUrl')  || '',
  modelApiVer:   localStorage.getItem('modelApiVer')   || '2024-08-01-preview',
  repos: [],
  primaryRepo: null,
  connectedRepos: [],
  targetType: 'pr',
  prs: [], branches: [], commits: [],
  selectedPR: null, sourceBranch: '', targetBranch: '',
  commitSha: '',
  report: null,
  lastRequestId: null,
  humanReview: null,  // pending human review state
  history: JSON.parse(localStorage.getItem('analysisHistory') || '[]'),
};

// ── Agent metadata (display names, icons, pipeline phases) ───────────────────
const AGENT_META = {
  code_analysis:   { label:'Code Analysis',       icon:'ti-code',              phase:'Phase 1',  color:'#1a6cf6' },
  security:        { label:'Security Review',      icon:'ti-shield-lock',       phase:'Phase 1',  color:'#ef4444' },
  ast_analysis:    { label:'AST Analysis',         icon:'ti-binary-tree',       phase:'Phase 1b', color:'#8b5cf6' },
  secrets_entropy: { label:'Entropy / Secrets',    icon:'ti-key',               phase:'Phase 1b', color:'#ec4899' },
  taint_analysis:  { label:'Taint Analysis',       icon:'ti-arrows-diff',       phase:'Phase 1b', color:'#f97316' },
  iac_analysis:    { label:'IaC Scan',             icon:'ti-server',            phase:'Phase 1b', color:'#14b8a6' },
  temporal_risk:   { label:'Temporal Risk',        icon:'ti-clock-record',      phase:'Phase 1b', color:'#a855f7' },
  schema_change:   { label:'Schema Changes',       icon:'ti-database',          phase:'Phase 1b', color:'#06b6d4' },
  dependency:      { label:'Dependency Mapping',   icon:'ti-topology-star-3',   phase:'Phase 2',  color:'#f59e0b' },
  test_coverage:   { label:'Test Coverage',        icon:'ti-test-pipe',         phase:'Phase 2',  color:'#10b981' },
  interface:       { label:'Interface / API',      icon:'ti-api',               phase:'Phase 2',  color:'#3b82f6' },
  risk:            { label:'Risk Assessment',      icon:'ti-scale',             phase:'Phase 2',  color:'#0ea5e9' },
  remediation:     { label:'Remediation',          icon:'ti-tool',              phase:'Phase 3',  color:'#84cc16' },
};
const AGENT_ORDER = ['code_analysis','security','ast_analysis','secrets_entropy','taint_analysis','iac_analysis','temporal_risk','schema_change','dependency','test_coverage','interface','risk','remediation'];

function saveState() {
  ['provider','authMode','token','username','workspace','baseUrl',
   'modelProvider','modelName','modelApiKey','modelBaseUrl','modelApiVer',
   'backendUrl','backendKey'].forEach(k => {
    if(state[k] !== undefined && state[k] !== null) localStorage.setItem(k, state[k]);
  });
}

const LANG_COLORS = {JavaScript:'#f1e05a',TypeScript:'#3178c6',Python:'#3572A5',Java:'#b07219',Go:'#00ADD8',Ruby:'#701516',Kotlin:'#A97BFF',Rust:'#dea584',C:'#555555',Scala:'#c22d40',Shell:'#89e051'};
const VIEWS = ['configure','repos','target','results','history','settings','quality'];
const STEP_VIEWS = ['configure','repos','target','results'];
const STEPS = ['Connect','Repositories','Target','Results'];

// ── Navigation ────────────────────────────────────────────────────────────────
function showView(name) {
  VIEWS.forEach(v => { document.getElementById('view-'+v).style.display = 'none'; document.getElementById('nav-'+v).classList.remove('active'); });
  document.getElementById('view-'+name).style.display = 'block';
  document.getElementById('nav-'+name).classList.add('active');
  const idx = STEP_VIEWS.indexOf(name);
  document.getElementById('footer-bar').style.display = (idx >= 0 && idx < 3) ? 'flex' : 'none';
  updateTopbar(name);
  renderView(name);
}

function updateTopbar(name) {
  const titles = { configure:'Configure provider', repos:'Select repositories', target:'Analysis target', results:'Analysis results', history:'Past analyses', settings:'Backend settings', quality:'Quality metrics' };
  const subs = { configure:'Connect GitHub or Bitbucket', repos:'Choose primary repo and connected apps', target:'Pick PR, branch diff, or commit', results:'Review gate decision and findings', history:'Previous analysis runs', settings:'Configure backend API connection', quality:'Recall, precision & F1 across all detection agents' };
  document.getElementById('topbar-title').textContent = titles[name] || name;
  document.getElementById('topbar-sub').textContent = subs[name] || '';
  const u = document.getElementById('backend-url-display');
  u.textContent = state.backendUrl ? '⚡ '+state.backendUrl : '';
}

function goBack() {
  const views = ['configure','repos','target'];
  const cur = STEP_VIEWS.findIndex(v => document.getElementById('view-'+v).style.display !== 'none');
  if(cur > 0) showView(STEP_VIEWS[cur-1]);
}
function goNext() {
  const views = STEP_VIEWS;
  const cur = views.findIndex(v => document.getElementById('view-'+v).style.display !== 'none');
  if(cur === 2) {
    // Validate target selection before advancing
    if(!canProceedFromTarget()) { alert('Please select a pull request, branch pair, or commit SHA first.'); return; }
  }
  if(cur < 2) showView(views[cur+1]);
  else if(cur === 2) { state.report = null; showView('results'); }
}

// ── Render views ─────────────────────────────────────────────────────────────
function renderView(name) {
  const el = document.getElementById('view-'+name);
  if(name === 'configure') renderConfigure(el);
  else if(name === 'repos') renderRepos(el);
  else if(name === 'target') renderTarget(el);
  else if(name === 'results') renderResults(el);
  else if(name === 'history') renderHistory(el);
  else if(name === 'settings') renderSettings(el);
  else if(name === 'quality') renderQuality(el);
}

// ── Step indicator ───────────────────────────────────────────────────────────
function stepsHtml(active) {
  return `<div class="steps-row">${STEPS.map((s,i) => {
    const cls = i < active ? 'done' : i === active ? 'active' : '';
    const lbl = `<span class="step-label ${cls}">${s}</span>`;
    const circ = `<div class="step-circle ${cls}">${i < active ? '<i class="ti ti-check" style="font-size:12px"></i>' : i+1}</div>`;
    const line = i < STEPS.length-1 ? `<div class="step-line ${i < active ? 'done' : ''}"></div>` : '';
    return `<div class="step-item">${circ}${lbl}</div>${line}`;
  }).join('')}</div>`;
}

// ── Model provider catalogue (mirrors agents/llm_client.py PROVIDERS) ─────────
const MODEL_PROVIDERS = {
  anthropic:    {
    label:'Anthropic Claude', icon:'✦',
    models:['claude-sonnet-4-6','claude-haiku-4-5-20251001','claude-opus-4-6'],
    needsKey:true, needsUrl:false,
    keyPlaceholder:'sk-ant-api03-…', urlPlaceholder:'',
    hint:'Best quality for code analysis. <a href="https://console.anthropic.com/settings/keys" target="_blank">Get key ↗</a>',
  },

    models:['gpt-4o','gpt-4o-mini','gpt-4-turbo','gpt-3.5-turbo'],

  },
  azure_openai: {
    label:'Azure OpenAI', icon:'⬡',
    models:['gpt-4o','gpt-4-turbo','gpt-35-turbo'],
    needsKey:true, needsUrl:true,
    keyPlaceholder:'Azure API key', urlPlaceholder:'https://YOUR.openai.azure.com',

    label:'Ollama (Local)', icon:'🦙',
    models:['llama3.2','llama3.1','codellama','mistral','qwen2.5-coder','deepseek-coder','phi3','gemma2'],
    needsKey:false, needsUrl:true,
    keyPlaceholder:'', urlPlaceholder:'http://localhost:11434',
    hint:'Fully local — no data leaves your machine. Run: <code>ollama serve</code> then <code>ollama pull llama3.2</code>',
  },
  custom:       {
    label:'Custom / Org Llama', icon:'⚡',
    models:[],
    needsKey:true, needsUrl:true,
    keyPlaceholder:'Bearer token / API key', urlPlaceholder:'https://your-org-llm.company.com/v1',
    hint:'Any OpenAI-compatible endpoint — org-deployed Llama, Maverick, vLLM, Groq, Together AI, Fireworks, etc.<br>Auth: <code>Authorization: Bearer {key}</code><br>Payload: <code>{"model": "your-model", "messages": [{"role": "user", "content": "…"}]}</code>',
  },
};

function saveModelConfig() {
  localStorage.setItem('modelProvider', state.modelProvider);
  localStorage.setItem('modelName',     state.modelName);
  localStorage.setItem('modelApiKey',   state.modelApiKey);
  localStorage.setItem('modelBaseUrl',  state.modelBaseUrl);
  localStorage.setItem('modelApiVer',   state.modelApiVer);
}

function getModelConfig() {
  return {
    provider:    state.modelProvider,
    model:       state.modelName,
    api_key:     state.modelApiKey,
    base_url:    state.modelBaseUrl,
    api_version: state.modelApiVer,
  };
}

// ── CONFIGURE ─────────────────────────────────────────────────────────────────
const GIT_PROVIDERS = {
  github:            { label:'GitHub Cloud',              icon:'ti-brand-github',    bb:false, enterprise:false },
  github_enterprise: { label:'GitHub Enterprise',         icon:'ti-brand-github',    bb:false, enterprise:true  },
  bitbucket:         { label:'Bitbucket Cloud',            icon:'ti-brand-bitbucket', bb:true,  enterprise:false },
  bitbucket_server:  { label:'Bitbucket Server (On-Prem)', icon:'ti-brand-bitbucket', bb:true,  enterprise:true  },
};

function renderConfigure(el) {
  const gp = GIT_PROVIDERS[state.provider] || GIT_PROVIDERS.github;
  const isBB = gp.bb;
  const isEnt = gp.enterprise;

  el.innerHTML = `
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;max-width:960px">

    <!-- LEFT: Git provider config -->
    <div>
      <div class="card">
        <div class="card-title"><i class="ti ti-plug-connected"></i>Git Provider</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:18px">
          ${Object.entries(GIT_PROVIDERS).map(([k,v]) => `
          <div onclick="selectGitProvider('${k}')" style="border:1.5px solid ${state.provider===k?'#1a6cf6':'#e8eaed'};background:${state.provider===k?'#eff5ff':'#fff'};border-radius:8px;padding:11px 12px;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:8px">
            <i class="ti ${v.icon}" style="font-size:17px;color:${state.provider===k?'#1a6cf6':'#7a8494'};flex-shrink:0"></i>
            <span style="font-size:12px;font-weight:600;color:${state.provider===k?'#1a6cf6':'#3d4652'}">${v.label}</span>
            ${state.provider===k?'<i class="ti ti-check" style="margin-left:auto;font-size:13px;color:#1a6cf6"></i>':''}
          </div>`).join('')}
        </div>

        ${isEnt ? `
        <div class="field-group" style="margin-bottom:14px">
          <label>${isBB ? 'Bitbucket Server base URL' : 'GitHub Enterprise URL'}</label>
          <input type="url" value="${esc(state.baseUrl)}" placeholder="${isBB ? 'https://bitbucket.mycompany.com' : 'https://github.mycompany.com'}" oninput="state.baseUrl=this.value;saveState()"/>
          <div class="field-hint">${isBB ? 'Your on-premise Bitbucket Server URL (without /rest/api/...)' : 'Your GitHub Enterprise Server URL'}</div>
        </div>` : ''}

        <div class="card-title"><i class="ti ti-lock"></i>Authentication</div>
        <div style="display:flex;gap:8px;margin-bottom:14px">
          <div onclick="state.authMode='token';saveState();renderView('configure')" style="flex:1;padding:10px;border:1.5px solid ${state.authMode==='token'?'#1a6cf6':'#e8eaed'};background:${state.authMode==='token'?'#eff5ff':'#fff'};border-radius:8px;cursor:pointer;text-align:center;transition:all .15s">
            <i class="ti ti-key" style="font-size:20px;display:block;margin-bottom:4px;color:${state.authMode==='token'?'#1a6cf6':'#7a8494'}"></i>
            <span style="font-size:12px;font-weight:600;color:${state.authMode==='token'?'#1a6cf6':'#3d4652'}">${isBB ? 'HTTP Access Token' : 'Access Token'}</span>
          </div>
          <div onclick="state.authMode='password';saveState();renderView('configure')" style="flex:1;padding:10px;border:1.5px solid ${state.authMode==='password'?'#1a6cf6':'#e8eaed'};background:${state.authMode==='password'?'#eff5ff':'#fff'};border-radius:8px;cursor:pointer;text-align:center;transition:all .15s">
            <i class="ti ti-user" style="font-size:20px;display:block;margin-bottom:4px;color:${state.authMode==='password'?'#1a6cf6':'#7a8494'}"></i>
            <span style="font-size:12px;font-weight:600;color:${state.authMode==='password'?'#1a6cf6':'#3d4652'}">${isBB ? 'Username + Password' : 'Password'}</span>
          </div>
        </div>

        ${state.authMode === 'token' ? `
        <div class="field-group" style="margin-bottom:14px">
          <label>${isBB ? 'HTTP Access Token / Personal Access Token' : 'Personal access token'}</label>
          <input type="password" value="${esc(state.token)}" placeholder="${isBB ? (isEnt ? 'HTTP access token from your profile' : 'App password from bitbucket.org') : 'ghp_… or github_pat_…'}" oninput="state.token=this.value;saveState()"/>
          <div class="field-hint">
            ${isBB && isEnt
              ? '🔑 Bitbucket Server: <strong>Your avatar → Profile → HTTP Access Tokens → Create token</strong><br>Needs: Repository Read, Project Read'
              : isBB
                ? '🔑 <a href="https://bitbucket.org/account/settings/app-passwords/new" target="_blank">Create App Password ↗</a> — needs Repositories: Read, Pull requests: Read'
                : isEnt
                  ? `🔑 Create at <strong>${state.baseUrl||'your-server'}/settings/tokens/new</strong> — needs <code>repo</code> scope`
                  : '🔑 <a href="https://github.com/settings/tokens/new" target="_blank">Create Personal Access Token ↗</a> — needs <code>repo</code>, <code>read:org</code>'}
          </div>
        </div>` : `
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px">
          <div class="field-group">
            <label>Username</label>
            <input type="text" value="${esc(state.username)}" placeholder="${isBB ? 'your-username' : 'github-username'}" oninput="state.username=this.value;saveState()"/>
          </div>
          <div class="field-group">
            <label>${isBB && isEnt ? 'Password' : isBB ? 'App password' : 'Password'}</label>
            <input type="password" value="" oninput="state.password=this.value" placeholder="••••••••"/>
          </div>
        </div>`}

        ${isBB ? `
        <div class="field-group" style="margin-bottom:14px">
          <label>${isEnt ? 'Project key / Workspace' : 'Workspace slug'} <span style="font-weight:400;color:#7a8494">(optional)</span></label>
          <input type="text" value="${esc(state.workspace)}" oninput="state.workspace=this.value;saveState()" placeholder="${isEnt ? 'MYPROJECT' : 'my-workspace'}"/>
          <div class="field-hint">${isEnt ? 'Bitbucket Server project key (e.g. BANK). Leave blank to list all accessible repos.' : 'Your workspace slug from bitbucket.org/<strong>workspace</strong>/'}</div>
        </div>` : ''}

        <div id="auth-msg" style="margin-bottom:10px"></div>

        <div style="display:flex;align-items:center;gap:12px">

            <i class="ti ti-plug-connected"></i>Connect &amp; verify

          <div style="font-size:11px;color:#7a8494;display:flex;align-items:center;gap:5px">
            <i class="ti ti-shield-lock" style="color:#0c7c4b;font-size:14px"></i>
            All API calls proxied through backend — CORS-free
          </div>
        </div>
      </div>
    </div>

    <!-- RIGHT: AI model -->
    <div>
      <div class="card">
        <div class="card-title"><i class="ti ti-cpu"></i>AI Model</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px">
          ${Object.entries(MODEL_PROVIDERS).map(([k,v]) => `

function selectModelProvider(k) {

function selectGitProvider(k) {

async function doConnect() {
  const btn = document.getElementById('btn-connect');
  const msg = document.getElementById('auth-msg');
  const info = document.getElementById('auth-user-info');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Verifying…';
  msg.innerHTML = ''; if(info) info.innerHTML = '';

  try {
    // Always use backend proxy — eliminates CORS for ALL providers including Bitbucket Server
    const h = {'Content-Type':'application/json'};
    if(state.backendKey) h['X-API-Key'] = state.backendKey;

    const body = {
      provider: state.provider,
      base_url: state.baseUrl || '',
      token:    state.authMode==='token' ? state.token : '',
      username: state.authMode==='password' ? state.username : '',
      password: state.authMode==='password' ? (state.password||'') : '',
      workspace: state.workspace || '',
      path: '',  // not used for verify
    };

    const r = await fetch(_backendBase()+'/api/v1/git/verify', {
      method:'POST', headers:h, body:JSON.stringify(body)
    });
    if(r.status===401) throw new Error('Invalid credentials — check your token or password');
    if(!r.ok) { const t=await r.text(); throw new Error(`${r.status}: ${t.slice(0,200)}`); }

    state.userInfo = await r.json();
    const name = state.userInfo.login || state.userInfo.display_name || state.userInfo.username || state.username;
    if(!state.workspace && state.userInfo.username) state.workspace = state.userInfo.username;
    saveState();

    const connLabel = GIT_PROVIDERS[state.provider]?.label || state.provider;
    if(info) info.innerHTML = `<div style="display:flex;align-items:center;gap:8px;padding:10px 12px;background:#edfaf3;border:1px solid #b5e8cf;border-radius:8px;margin-bottom:12px;font-size:13px;color:#0c7c4b"><i class="ti ti-circle-check"></i>Connected as <strong>${esc(name)}</strong> on ${esc(connLabel)}</div>`;
    updateConnIndicator(true, name);
    setTimeout(() => showView('repos'), 600);
  } catch(e) {
    msg.innerHTML = `<div class="err-msg" style="margin:0"><i class="ti ti-alert-circle" style="flex-shrink:0;margin-top:1px"></i><div><strong>Connection failed</strong><br>${esc(e.message)}<br><span style="font-size:11px;opacity:.8">Make sure your backend is running at ${esc(state.backendUrl||'http://localhost:8080')}</span></div></div>`;
    updateConnIndicator(false);
  }
  btn.disabled = false; btn.innerHTML = '<i class="ti ti-plug-connected"></i>Connect &amp; verify';
}

function updateConnIndicator(ok, name) {
  const dot = document.getElementById('conn-dot');
  const txt = document.getElementById('conn-text');
  dot.className = 'conn-dot' + (ok?' ok':'');
  txt.textContent = ok ? name : 'Not connected';
}

function renderChips() {
  return state.connectedRepos.map(r => `<div class="chip"><i class="ti ti-git-branch" style="font-size:12px"></i>${shortName(r)}<button onclick="removeConnected('${repoName(r)}')"><i class="ti ti-x"></i></button></div>`).join('');

function renderRepoGrid(repos, mode) {
  return repos.slice(0, 80).map(r => {
    const n = repoName(r);
    const isPrimary = state.primaryRepo && repoName(state.primaryRepo) === n;
    const isConn = state.connectedRepos.some(x => repoName(x) === n);
    let cls = isPrimary ? 'primary' : isConn ? 'connected' : '';
    const lang = repoLang(r);
    return `<div class="repo-tile ${cls}" onclick="selectRepo('${n}','${mode}')">
      <div class="repo-tile-name" title="${n}">${shortName(r)}</div>
      <div class="repo-tile-meta">
        ${lang ? `<span class="lang-dot" style="background:${LANG_COLORS[lang]||'#4a5b7a'}"></span><span>${lang}</span>` : ''}
        ${isPrimary ? '<span class="badge badge-green" style="font-size:10px;padding:1px 5px">primary</span>' : ''}
        ${isConn ? '<span class="badge badge-blue" style="font-size:10px;padding:1px 5px">+</span>' : ''}
      </div>
    </div>`;
  }).join('');
}

function selectRepo(name, mode) {
  const r = state.repos.find(x => repoName(x) === name);
  if(!r) return;
  if(mode === 'primary') {
    if(!state.primaryRepo || repoName(state.primaryRepo) !== name) {
      // Reset all target state when primary repo changes
      state.prs = []; state.branches = []; state.commits = [];
      state.selectedPR = null; state.sourceBranch = ''; state.targetBranch = ''; state.commitSha = '';
      targetLoadState.pr = null; targetLoadState.branch = null; targetLoadState.commit = null;
    }
    state.primaryRepo = r;
    state.connectedRepos = state.connectedRepos.filter(x => repoName(x) !== name);
  } else {
    if(state.primaryRepo && repoName(state.primaryRepo) === name) { state.primaryRepo = r; }
    else {
      const idx = state.connectedRepos.findIndex(x => repoName(x) === name);
      if(idx >= 0) state.connectedRepos.splice(idx, 1);
      else state.connectedRepos.push(r);
    }
  }
  renderView('repos');
}

function removeConnected(name) { state.connectedRepos = state.connectedRepos.filter(x => repoName(x) !== name); renderView('repos'); }

function filterRepos() {
  const q = document.getElementById('repo-search').value.toLowerCase();
  const filtered = state.repos.filter(r => repoName(r).toLowerCase().includes(q));
  document.getElementById('primary-grid').innerHTML = renderRepoGrid(filtered, 'primary');
  document.getElementById('connected-grid').innerHTML = renderRepoGrid(filtered.filter(r => !state.primaryRepo || repoName(r) !== repoName(state.primaryRepo)), 'connected');
}

// Shared proxy helper - all git API calls go through backend proxy (no CORS)
// ── Git proxy helpers — all call /api/v1/git/* on the backend ─────────────────

function _gitCfg() {
  // GitConfig body sent to every proxy endpoint
  return {
    provider:  state.provider,
    base_url:  state.baseUrl || '',
    auth_mode: state.authMode,
    token:     state.token    || '',
    username:  state.username || '',
    password:  state.password || '',
    workspace: state.workspace || '',
  };
}

function _backendBase() {
  return (state.backendUrl || 'http://localhost:8080');
}

function _backendHeaders() {
  const h = { 'Content-Type': 'application/json' };
  if (state.backendKey) h['X-API-Key'] = state.backendKey;
  return h;
}

async function _backendPost(path, body) {
  const r = await fetch(_backendBase() + path, {
    method:  'POST',
    headers: _backendHeaders(),
    body:    JSON.stringify(body),
    signal:  AbortSignal.timeout(30000),
  });
  if (!r.ok) {
    const t = await r.text().catch(() => '');
    let msg = t;
    try { msg = JSON.parse(t).detail || t; } catch {}
    throw new Error(`${r.status}: ${msg.slice(0, 200)}`);
  }
  return r.json();
}

// Fetch repos via backend proxy
async function gitProxyRepos() {
  return _backendPost('/api/v1/git/repos', _gitCfg());
}

// Fetch PRs via backend proxy — repo_slug in the URL path
async function gitProxyPRs(repoSlug) {
  return _backendPost(`/api/v1/git/prs/${encodeURIComponent(repoSlug)}`, _gitCfg());
}

// Fetch branches via backend proxy
async function gitProxyBranches(repoSlug) {
  return _backendPost(`/api/v1/git/branches/${encodeURIComponent(repoSlug)}`, _gitCfg());
}

// Fetch commits via backend proxy
async function gitProxyCommits(repoSlug) {
  return _backendPost(`/api/v1/git/commits/${encodeURIComponent(repoSlug)}`, _gitCfg());
}

// Fetch unified diff via backend proxy
async function gitProxyDiff(changeType, repoSlug, source, target, prId) {
  const body = {
    cfg:         _gitCfg(),
    change_type: changeType,
    repo_slug:   repoSlug,
    source:      source  || '',
    target:      target  || '',
    pr_id:       prId    || '',
  };
  const d = await _backendPost('/api/v1/git/diff', body);
  return d.diff || '';
}

// Verify credentials via backend proxy
async function gitProxyVerify() {
  return _backendPost('/api/v1/git/verify', _gitCfg());
}

async function loadRepos() {
  try {
    const d = await gitProxyRepos();
    state.repos = d.repos || [];
    renderView('repos');
  } catch(e) {
    const el = document.getElementById('repo-load-status');
    if(el) el.innerHTML = `<div class="err-msg" style="margin:0"><i class="ti ti-alert-circle" style="flex-shrink:0"></i>Failed to load repos: ${esc(e.message)}</div>`;
  }
}

async function loadTargetData() {
  const t = state.targetType;
  targetLoadState[t] = true;
  const bodyEl = document.getElementById('target-body');
  if(bodyEl) bodyEl.innerHTML = renderTargetBody();

  try {
    const slug = repoName(state.primaryRepo);

    if(t === 'pr') {
      const d = await gitProxyPRs(slug);
      state.prs = d.prs || [];

    } else if(t === 'branch') {
      const d = await gitProxyBranches(slug);
      state.branches = d.branches || [];
      if(!state.targetBranch) {
        const names = state.branches.map(b => branchName(b));
        state.targetBranch = names.find(n=>n==='main') || names.find(n=>n==='master') || names[0] || '';
      }

    } else {
      const d = await gitProxyCommits(slug);
      state.commits = d.commits || [];
    }

    targetLoadState[t] = false;
  } catch(e) {
    console.error('Target load error:', e);
    targetLoadState[t] = e.message || 'Unknown error';
  }

  const bodyEl2 = document.getElementById('target-body');
  if(bodyEl2) bodyEl2.innerHTML = renderTargetBody();
  updateNextButton();
}
// Explicit loading state: null=not started, true=loading, false=done, string=error
const targetLoadState = { pr: null, branch: null, commit: null };

function renderTarget(el) {
  if(!state.primaryRepo) {
    el.innerHTML = stepsHtml(2)+'<div class="err-msg"><i class="ti ti-alert-circle"></i>Select a primary repository first.</div>';
    return;
  }
  el.innerHTML = stepsHtml(2) + `
  <div class="card">
    <div class="card-title"><i class="ti ti-target"></i>Target — ${repoName(state.primaryRepo)}</div>
    <div class="tabs">
      <button class="tab ${state.targetType==='pr'?'active':''}" onclick="setTargetType('pr')"><i class="ti ti-git-pull-request"></i> Pull request</button>
      <button class="tab ${state.targetType==='branch'?'active':''}" onclick="setTargetType('branch')"><i class="ti ti-git-branch"></i> Branch diff</button>
      <button class="tab ${state.targetType==='commit'?'active':''}" onclick="setTargetType('commit')"><i class="ti ti-git-commit"></i> Commit</button>
    </div>
    <div id="target-body">${renderTargetBody()}</div>
  </div>
  ${state.connectedRepos.length ? `
  <div class="card">
    <div class="card-title"><i class="ti ti-topology-star-3"></i>Connected repos in scope</div>
    <div class="chips">${state.connectedRepos.map(r=>`<div class="chip"><i class="ti ti-git-branch" style="font-size:12px"></i>${shortName(r)}</div>`).join('')}</div>
    <div style="font-size:12px;color:#7a8494">These repos will be included in dependency blast radius and interface contract analysis.</div>
  </div>` : ''}`;

  // Only trigger load if this tab hasn't been loaded yet
  if(targetLoadState[state.targetType] === null) loadTargetData();
  // Always sync the Continue button state
  setTimeout(updateNextButton, 0);
}

function renderTargetBody() {
  const t = state.targetType;
  const loadState = targetLoadState[t];

  // ── Still loading ──────────────────────────────────────────────────────────
  if(loadState === true) {
    const label = t==='pr' ? 'pull requests' : t==='branch' ? 'branches' : 'commits';
    return `<div class="empty-state"><span class="spinner" style="width:24px;height:24px"></span><div style="margin-top:12px">Loading ${label}...</div></div>`;
  }

  // ── API error ──────────────────────────────────────────────────────────────
  if(typeof loadState === 'string') {
    return `<div class="err-msg" style="margin:0"><i class="ti ti-alert-circle" style="flex-shrink:0"></i>
      <div><strong>Failed to load data</strong><br/>${escHtml(loadState)}<br/>
      <button class="btn btn-sm" style="margin-top:8px" onclick="retryLoad()"><i class="ti ti-refresh"></i>Retry</button></div>
    </div>`;
  }

  // ── Pull requests ──────────────────────────────────────────────────────────
  if(t === 'pr') {
    if(!state.prs.length) return `
      <div class="empty-state">
        <i class="ti ti-git-pull-request"></i>
        <div style="margin-bottom:12px">No open pull requests found in this repository.</div>
        <div style="font-size:12px;color:#7a8494;margin-bottom:12px">Switch to <strong>Branch diff</strong> or <strong>Commit</strong> to analyse without a PR.</div>
        <button class="btn btn-sm" onclick="retryLoad()"><i class="ti ti-refresh"></i>Refresh</button>
      </div>`;
    return `<div class="list-scroll">${state.prs.map(p=>{
      const id = prNum(p); const sel = state.selectedPR && prNum(state.selectedPR)===id;
    return `<div class="list-item ${sel?'selected':''}" onclick="selectPR('${id}')" style="cursor:pointer">
        <i class="ti ti-git-pull-request" style="font-size:18px;color:${sel?'#1a6cf6':'#7a8494'};flex-shrink:0"></i>
        <div class="li-main">
          <div class="li-title">${escHtml(prTitle(p))}</div>
          <div class="li-sub">${id} · ${escHtml(prHead(p))} → ${escHtml(prBase(p))} · by ${escHtml(prAuthor(p))}</div>
        </div>
        <i class="ti ${sel?'ti-circle-check':'ti-circle'}" style="color:${sel?'#1a6cf6':'#e8eaed'};font-size:20px;flex-shrink:0;transition:all 0.15s"></i>
      </div>`;
    }).join('')}</div>`;
  }

  // ── Branch diff ────────────────────────────────────────────────────────────
  if(t === 'branch') {
    if(!state.branches.length) return `
      <div class="empty-state">
        <i class="ti ti-git-branch"></i>
        <div style="margin-bottom:12px">No branches found.</div>
        <button class="btn btn-sm" onclick="retryLoad()"><i class="ti ti-refresh"></i>Retry</button>
      </div>`;
    const opts = state.branches.map(b=>`<option value="${escHtml(branchName(b))}" ${state.sourceBranch===branchName(b)?'selected':''}>${escHtml(branchName(b))}</option>`).join('');
    const topts = state.branches.map(b=>`<option value="${escHtml(branchName(b))}" ${state.targetBranch===branchName(b)?'selected':''}>${escHtml(branchName(b))}</option>`).join('');
    return `
      <div class="two-col">
        <div class="field">
          <label>Source branch (your feature branch)</label>
          <select onchange="state.sourceBranch=this.value;document.getElementById('branch-preview').style.display=state.sourceBranch&&state.targetBranch?'flex':'none';document.getElementById('branch-from').textContent=state.sourceBranch;updateNextButton();"><option value="">— select source —</option>${opts}</select>
        </div>
        <div class="field">
          <label>Target branch (merge into)</label>
          <select onchange="state.targetBranch=this.value;document.getElementById('branch-preview').style.display=state.sourceBranch&&state.targetBranch?'flex':'none';document.getElementById('branch-into').textContent=state.targetBranch;updateNextButton();"><option value="">— select target —</option>${topts}</select>
        </div>
      </div>
      <div id="branch-preview" class="info-msg" style="display:${state.sourceBranch&&state.targetBranch?'flex':'none'}">
        <i class="ti ti-arrow-right-bar"></i>
        <span>Analysing: <strong id="branch-from">${escHtml(state.sourceBranch)}</strong> → <strong id="branch-into">${escHtml(state.targetBranch)}</strong></span>
      </div>`;
  }

  // ── Commit ─────────────────────────────────────────────────────────────────
  if(t === 'commit') {
    const commitList = state.commits.length
      ? state.commits.map(c => {
          const sha = commitSha(c); const sel = state.commitSha===sha;
          return `<div class="list-item ${sel?'selected':''}" onclick="pickCommit('${sha}')">
            <code style="font-size:11px;flex-shrink:0;width:56px;text-align:center;color:#1a6cf6">${sha}</code>
            <div class="li-main">
              <div class="li-title">${escHtml((commitMsg(c)||'').slice(0,80))}</div>
              <div class="li-sub">${escHtml(commitAuthor(c))}</div>
            </div>
            ${sel?'<i class="ti ti-circle-check" style="color:#1a6cf6;font-size:18px;flex-shrink:0"></i>':''}
          </div>`;
        }).join('')
      : `<div class="empty-state"><i class="ti ti-git-commit"></i>No commits loaded.<br/><button class="btn btn-sm" style="margin-top:8px" onclick="retryLoad()"><i class="ti ti-refresh"></i>Retry</button></div>`;

    return `
      <div class="field">
        <label>Commit SHA (type manually or click from list below)</label>
        <input type="text" id="sha-input" placeholder="e.g. a1b2c3d" value="${escHtml(state.commitSha)}" oninput="state.commitSha=this.value;updateNextButton();" style="font-family:var(--mono);font-size:13px"/>
      </div>
      <div class="list-scroll">${commitList}</div>`;
  }
  return '';
}

function pickCommit(sha) {
  state.commitSha = sha;
  const inp = document.getElementById('sha-input');
  if(inp) inp.value = sha;
  renderView('target');
  updateNextButton();
}

function setTargetType(t) {
  state.targetType = t;
  state.selectedPR = null;
  renderView('target');
  // Trigger load only if this tab has never been attempted
  if(targetLoadState[t] === null) loadTargetData();
}

function retryLoad() {
  targetLoadState[state.targetType] = null; // reset so it re-fetches
  renderView('target');
}

function selectPR(id) {
  state.selectedPR = state.prs.find(p=>prNum(p)===id)||null;
  renderView('target');
  updateNextButton();
}

// ── TARGET ───────────────────────────────────────────────────────────────────

function updateNextButton() {
  const btn = document.getElementById('btn-next');
  if(!btn) return;
  const ok = canProceedFromTarget();
  btn.disabled = !ok;
  btn.title = ok ? '' : 'Select a PR, branch pair, or commit SHA first';
}

function canProceedFromTarget() {
  if(state.targetType==='pr') return !!state.selectedPR;
  if(state.targetType==='branch') return !!(state.sourceBranch && state.targetBranch && state.sourceBranch !== state.targetBranch);
  if(state.targetType==='commit') return state.commitSha.length >= 5;
  return false;
}

// ── Diff code-snippet helpers ─────────────────────────────────────────────────

function parseDiffToSnippets(diffText) {
  const result = {};
  if (!diffText) return result;
  let currentFile = null, newLine = 0, oldLine = 0;
  for (const raw of diffText.split('\n')) {
    if (raw.startsWith('+++ b/')) {
      currentFile = raw.slice(6).trim();
      result[currentFile] = [];
      continue;
    }
    if (raw.startsWith('--- ') || raw.startsWith('+++ ')) continue;
    const hm = raw.match(/^@@ -(\d+)(?:,\d+)? \+(\d+)(?:,\d+)? @@/);
    if (hm) { oldLine = parseInt(hm[1]); newLine = parseInt(hm[2]); continue; }
    if (!currentFile) continue;
    if (raw.startsWith('+'))      result[currentFile].push({newLine:newLine++, oldLine:null,    content:raw.slice(1), type:'add'});
    else if (raw.startsWith('-')) result[currentFile].push({newLine:null,    oldLine:oldLine++, content:raw.slice(1), type:'del'});
    else                          result[currentFile].push({newLine:newLine++, oldLine:oldLine++, content:raw.length?raw.slice(1):raw, type:'ctx'});
  }
  return result;
}

let _snipDiffText = null, _snipCache = null;
function getDiffSnippets() {
  if (_snipDiffText !== (state.diffText||'')) {
    _snipDiffText = state.diffText || '';
    _snipCache = parseDiffToSnippets(_snipDiffText);
  }
  return _snipCache || {};
}

function getCodeSnippet(file, lineRef, ctx = 3) {
  if (!file || !lineRef) return '';
  const snips = getDiffSnippets();
  let lines = snips[file];
  if (!lines) {
    const key = Object.keys(snips).find(k => k === file || k.endsWith('/'+file) || file.endsWith('/'+k.split('/').pop()));
    lines = key ? snips[key] : null;
  }
  if (!lines || !lines.length) return '';
  const m = String(lineRef).match(/^(\d+)(?:[,-](\d+))?$/);
  if (!m) return '';
  const s = parseInt(m[1]), e = m[2] ? parseInt(m[2]) : s;
  const relevant = lines.filter(l => { const ln = l.newLine ?? l.oldLine; return ln != null && ln >= s - ctx && ln <= e + ctx; });
  if (!relevant.length) return '';
  const rows = relevant.map(l => {
    const ln = l.newLine ?? l.oldLine ?? '';
    const tc = l.type === 'add' ? 'add' : l.type === 'del' ? 'del' : 'ctx';
    const pfx = l.type === 'add' ? '+' : l.type === 'del' ? '-' : ' ';
    return `<div class="code-snippet-line ${tc}"><span class="code-snippet-ln">${ln}</span><span class="code-snippet-content">${pfx}${escHtml(l.content)}</span></div>`;
  }).join('');
  return `<div class="code-snippet">${rows}</div>`;
}

          ${getCodeSnippet(f.file, f.line, 2)}
        </div></div>`).join('');

    // ── AST Analysis ─────────────────────────────────────────────────────
    const astBody = !ast ? emptyState('Agent did not run') :
      (ast.findings||[]).length === 0 ? emptyState(`No AST issues — max complexity: ${ast.max_complexity||0}`) :
      `<div style="display:flex;gap:10px;margin-bottom:10px">
        <span class="badge badge-dim">avg complexity ${(ast.avg_complexity||0).toFixed(1)}</span>
        <span class="badge ${(ast.max_complexity||0)>10?'badge-red':(ast.max_complexity||0)>6?'badge-amber':'badge-dim'}">max ${ast.max_complexity||0}</span>
      </div>` +
      (ast.findings||[]).map(f=>`<div class="finding">
        <span class="sev sev-${f.severity}">${f.severity}</span>
        <div class="finding-body">
          <div class="finding-desc"><code>${escHtml(f.kind||'')}</code> in <code>${escHtml(f.function||'')}</code></div>
          <div class="finding-file">${escHtml(f.description||'')}${f.suggestion?` — ${escHtml(f.suggestion)}`:''}${f.line?' · line '+f.line:''}</div>
          ${getCodeSnippet(f.file, f.line, 3)}
        </div></div>`).join('');

    // ── Taint Analysis ────────────────────────────────────────────────────
    const taBody = !ta ? emptyState('Agent did not run') :
      (ta.taint_paths||[]).length === 0 ? emptyState(`No taint paths — ${ta.sources_found||0} sources, ${ta.sinks_found||0} sinks scanned`) :
      `<div style="display:flex;gap:10px;margin-bottom:10px">
        ${ta.has_injection?`<span class="badge badge-red"><i class="ti ti-alert-triangle" style="font-size:11px"></i>Injection risk</span>`:''}
        <span class="badge badge-dim">${ta.sources_found||0} sources · ${ta.sinks_found||0} sinks</span>
      </div>` +
      (ta.taint_paths||[]).map(p=>`<div class="finding">
        <span class="sev sev-${p.severity}">${p.severity}</span>
        <div class="finding-body">
          <div class="finding-desc">${p.cwe?`<code>${escHtml(p.cwe)}</code> `:''}${escHtml(p.description||`${p.source_var||'input'} → ${p.sink_kind||'sink'}`)}</div>
          <div class="finding-file">source: <code>${escHtml(p.source_var||'?')} (${escHtml(p.source_kind||'?')})</code> → sink: <code>${escHtml(p.sink_var||'?')} (${escHtml(p.sink_kind||'?')})</code></div>
          ${p.source_file&&p.source_line?`<div style="font-size:10px;color:#9fadbf;margin-top:5px;font-family:var(--mono)">source: ${escHtml(p.source_file)} · line ${p.source_line}</div>${getCodeSnippet(p.source_file, p.source_line, 2)}`:''}
          ${p.sink_file&&p.sink_line?`<div style="font-size:10px;color:#9fadbf;margin-top:5px;font-family:var(--mono)">sink: ${escHtml(p.sink_file)} · line ${p.sink_line}</div>${getCodeSnippet(p.sink_file, p.sink_line, 2)}`:''}
        </div></div>`).join('');

    // ── IaC Security ──────────────────────────────────────────────────────
    const iacBody = !iac ? emptyState('Agent did not run') :
      (iac.findings||[]).length === 0 ? emptyState('No IaC security issues found') :
      (iac.findings||[]).map(f=>`<div class="finding">
        <span class="sev sev-${f.severity}">${f.severity}</span>
        <div class="finding-body">
          <div class="finding-desc"><code>${escHtml(f.kind||'')}</code> — ${escHtml(f.description||'')}</div>
          <div class="finding-file">resource: <code>${escHtml(f.resource||'')}</code>${f.cis_ref?` · CIS ${escHtml(f.cis_ref)}`:''}${f.line?' · line '+f.line:''}</div>
          ${getCodeSnippet(f.file, f.line, 3)}
        </div></div>`).join('');

    // ── Temporal Risk ─────────────────────────────────────────────────────
    const trendColor = {improving:'#0c7c4b',stable:'#7a8494',degrading:'#8a5200',critical:'#b81c1c'}[tr?.risk_trend||'stable']||'#7a8494';
    const trBody = !tr ? emptyState('Agent did not run') :
      `<div style="display:flex;gap:10px;margin-bottom:10px">
        <span class="badge" style="background:#f7f8fa;color:${trendColor};border-color:${trendColor}">trend: ${tr.risk_trend||'stable'}</span>
        ${tr.escalating_pattern?`<span class="badge badge-amber">Escalating pattern</span>`:''}
        ${tr.security_erosion?`<span class="badge badge-red">Security erosion</span>`:''}
      </div>` +
      ((tr.hot_files||[]).length===0 ? emptyState('No hot files in analysis window') :
        (tr.hot_files||[]).map(f=>`<div class="finding">
          <span class="sev sev-medium">hot</span>
          <div class="finding-body">
            <div class="finding-desc"><code>${escHtml(f.file_path||'')}</code></div>
            <div class="finding-file">changed ${f.change_count||0}× · avg risk ${(f.avg_risk_score||0).toFixed(0)}</div>
          </div></div>`).join(''));

    return `<div class="card">
      ${agentSection('ti-key','#ec4899','Entropy / Secrets',seBody)}
      ${agentSection('ti-binary-tree','#8b5cf6','AST Analysis',astBody)}
      ${agentSection('ti-arrows-diff','#f97316','Taint Analysis',taBody)}
      ${agentSection('ti-server','#14b8a6','IaC Security',iacBody)}
      <div>${agentSection('ti-clock-record','#a855f7','Temporal Risk',trBody)}</div>
    </div>`;
  }

  if(tab==='timings') {
    const timings = r.agent_timings || [];
    const totalTokens = r.token_usage || 0;
    const totalTime   = r.duration_s  || 0;
    const maxTime     = timings.length ? Math.max(...timings.map(t=>t.duration_s||0), 0.1) : 1;
    const maxTokens   = timings.length ? Math.max(...timings.map(t=>t.tokens||0), 1) : 1;

    const AGENT_COLORS = {
      code_analysis:'#1a6cf6', security:'#ef4444', test_coverage:'#10b981',
      dependency:'#f59e0b',    interface:'#8b5cf6', risk:'#0ea5e9',
      remediation:'#f97316',   schema_change:'#06b6d4',
    };
    const agentColor = name => AGENT_COLORS[name] || '#7a8494';
    const shortName  = name => name.replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase());

    if(!timings.length) return `
      <div class="card">
        <div class="section-heading"><i class="ti ti-clock"></i>Agent timings</div>
        <div class="empty-state"><i class="ti ti-clock-off"></i>No timing data — run analysis with a connected backend to see per-agent metrics</div>
      </div>`;

    const bars = timings.map(t => {
      const timePct   = Math.round(((t.duration_s||0)/maxTime)*100);
      const tokenPct  = Math.round(((t.tokens||0)/maxTokens)*100);
      const col = agentColor(t.agent);
      const isFallback = !t.tokens || t.tokens===0;
      return `
        <div style="margin-bottom:14px">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:5px">

              <div style="width:10px;height:10px;border-radius:2px;background:${col};flex-shrink:0"></div>
              <span style="font-size:13px;font-weight:500;color:#0d1117">${shortName(t.agent)}</span>
              ${isFallback?`<span style="font-size:10px;background:#fff8ec;border:1px solid #f59e0b;border-radius:10px;padding:1px 7px;color:#8a5200">fallback</span>`:''}
            </div>
            <div style="display:flex;gap:14px;font-size:12px;font-family:'JetBrains Mono',monospace">
              <span style="color:#7a8494"><span style="color:#0d1117;font-weight:600">${(t.duration_s||0).toFixed(2)}s</span></span>
              <span style="color:#7a8494"><span style="color:#0d1117;font-weight:600">${(t.tokens||0).toLocaleString()}</span> tok</span>
            </div>
          </div>
          <div style="display:flex;flex-direction:column;gap:3px">
            <div style="display:flex;align-items:center;gap:8px">
              <div style="width:38px;font-size:10px;color:#9fadbf;text-align:right;flex-shrink:0">time</div>

    const rows = timings.map(t => {

    return `
      <div class="card">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px">
          <div class="section-heading" style="margin-bottom:0"><i class="ti ti-clock-bolt"></i>Agent timings &amp; token usage</div>

            <span>Total: <strong style="color:#0d1117;font-family:'JetBrains Mono',monospace">${totalTime.toFixed(1)}s</strong></span>

        <div style="border-top:1px solid #e8eaed;padding-top:14px">
          <table style="width:100%;border-collapse:collapse">
            <thead>

              </tr>
            </tbody>

  }

  if(tab==='qa') {

    const priColor = p => ({critical:'#b81c1c',high:'#8a5200',medium:'#1a6cf6',low:'#6b7280'})[p?.toLowerCase()]||'#6b7280';
    const priLabel = p => (p||'').toUpperCase();
    const typeIcon  = t => ({functional:'ti-click',security:'ti-shield-lock',regression:'ti-arrows-right-left',edge_case:'ti-test-pipe',integration:'ti-puzzle',performance:'ti-gauge',api:'ti-api',data:'ti-database'})[t]||'ti-checklist';

    // Active filter state (stored on the element via closure)
    const filterKey = 'qaFilter_'+Date.now();

    const priorities = ['all','critical','high','medium','low'];
    const types = ['functional','security','regression','edge_case','integration','performance','api','data'];

    const renderScenarios = (filter) => {

      return filtered.map(s => `
        <div class="card" style="margin-bottom:12px;border-left:3px solid ${priColor(s.priority)}">
          <div style="display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:10px">

              ${s.steps.map(step=>`<li>${escHtml(step)}</li>`).join('')}

          </div>` : ''}

          ${critN?`<span style="color:#b81c1c;font-weight:700"><i class="ti ti-alert-circle"></i> ${critN} critical</span>`:''}
          ${highN?`<span style="color:#8a5200;font-weight:700"><i class="ti ti-alert-triangle"></i> ${highN} high</span>`:''}
          <span style="color:#7a8494">${qa.total_scenarios} total</span>

      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap" id="qa-filter-bar">
        ${priorities.map(p=>`<button class="btn${p==='all'?' btn-primary':''}" style="font-size:11px;padding:4px 10px" onclick="qaFilterClick('${p}','${filterKey}')">${p==='all'?'All':p.charAt(0).toUpperCase()+p.slice(1)}</button>`).join('')}
        <span style="width:1px;background:#e8eaed;margin:0 4px"></span>
        ${types.map(t=>`<button class="btn" style="font-size:11px;padding:4px 10px" onclick="qaFilterClick('${t}','${filterKey}')">${t.replace(/_/g,' ')}</button>`).join('')}
      </div>
    </div>
    <div id="qa-scenario-list">${renderScenarios('all')}</div>`;
  }

  return '';
}
