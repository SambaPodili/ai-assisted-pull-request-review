async function fetchRealDiff(target) {
  /** Fetch unified diff via backend proxy — no CORS, works for all providers */
  try {
    const slug = repoName(state.primaryRepo);
    return await gitProxyDiff(
      target.changeType,
      slug,
      target.source,
      target.target,
      target.meta?.pr_id || ''
    );
  } catch(e) {
    console.warn('Diff fetch failed:', e.message);
    return '';
  }
}

// ── Live pipeline renderer ────────────────────────────────────────────────────
function renderLivePipeline(agentMap) {
  // agentMap: { agent_key: {status, tokens, duration_s, elapsed_s, model, fallback} }
  const phases = ['Phase 1','Phase 1b','Phase 2','Phase 3'];
  const byPhase = {};
  phases.forEach(p => byPhase[p] = []);

  AGENT_ORDER.forEach(key => {
    const meta = AGENT_META[key];
    if(!meta) return;
    const entry = agentMap[key] || { status:'pending', tokens:0, duration_s:0, elapsed_s:0 };
    (byPhase[meta.phase] || byPhase['Phase 2']).push({ key, meta, entry });
  });

  const maxTok = Math.max(1, ...Object.values(agentMap).map(e => e.tokens||0));

  let html = '';
  phases.forEach(phase => {
    const rows = byPhase[phase];
    if(!rows || !rows.length) return;
    html += `<div class="pipeline-phase">${phase}</div>`;
    rows.forEach(({ key, meta, entry }) => {
      const st = entry.status;
      const isRunning  = st === 'running';
      const isDone     = st === 'done';
      const isFallback = st === 'fallback';
      const isPending  = st === 'pending';

      const timeVal = isRunning
        ? `<span class="agent-stat" data-elapsed="${key}" style="color:#1a6cf6">${(entry.elapsed_s||0).toFixed(1)}s</span>`
        : (isDone||isFallback)
          ? `<span class="agent-stat">${(entry.duration_s||0).toFixed(2)}s</span>`
          : `<span class="agent-stat dim">—</span>`;

      const tokVal = (isDone && entry.tokens)
        ? `<span class="agent-tok">${entry.tokens.toLocaleString()} tok</span>`
        : isFallback
          ? `<span class="agent-tok" style="color:#f59e0b">fallback</span>`
          : `<span class="agent-tok" style="color:#e8eaed">—</span>`;

      const tokPct = isDone ? Math.round((entry.tokens/maxTok)*100) : 0;
      const barFill = isDone
        ? `<div class="agent-bar-fill" style="width:${tokPct}%;background:${meta.color}"></div>`
        : isRunning
          ? `<div class="agent-bar-fill" style="width:30%;background:#bfdbfe;animation:pulse-dot 1.2s infinite"></div>`
          : '';

      html += `<div class="agent-row ${isPending?'':''+st}">
        <div class="agent-dot ${st}"></div>
        <i class="ti ${meta.icon}" style="font-size:14px;color:${isDone?meta.color:isFallback?'#f59e0b':isRunning?'#3b82f6':'#d1d5db'};flex-shrink:0"></i>
        <span class="agent-name ${isPending?'pending':''}">${meta.label}</span>
        ${isRunning ? `<span class="agent-badge running">running</span>` : ''}
        ${isDone    ? `<span class="agent-badge done">done</span>` : ''}
        ${isFallback? `<span class="agent-badge fallback">fallback</span>` : ''}
        ${timeVal}
        ${tokVal}
        <div class="agent-bar">${barFill}</div>
      </div>`;
    });
  });
  return html;
}

async function runAnalysis() {
  const statusEl  = () => document.getElementById('agent-status');
  const progEl    = () => document.getElementById('progress-fill');
  const progLbl   = () => document.getElementById('progress-label');
  const progPct   = () => document.getElementById('progress-pct');
  const pipeEl    = () => document.getElementById('agent-pipeline');
  const counterEl = () => document.getElementById('elapsed-counter');
  const diffInfoEl= () => document.getElementById('diff-info');
  const diffTxtEl = () => document.getElementById('diff-info-text');
  const simHint   = () => document.getElementById('sim-hint');

  const target = buildAnalysisTarget();
  const headers = { 'Content-Type':'application/json' };
  if(state.backendKey) headers['X-API-Key'] = state.backendKey;

  // Live wall-clock ticker
  const runStart = Date.now();
  const clockTimer = setInterval(() => {
    const el = counterEl();
    if(el) el.textContent = ((Date.now()-runStart)/1000).toFixed(0)+'s';
  }, 500);

  // ── Step 0: Fetch diff ─────────────────────────────────────────────────────
  if(statusEl()) statusEl().textContent = 'Fetching diff…';
  if(progEl())   progEl().style.width   = '5%';
  if(progLbl())  progLbl().textContent  = 'Fetching diff…';

  const diffText  = await fetchRealDiff(target);
  state.diffText  = diffText || '';
  const diffLines = diffText ? diffText.split('\n').length : 0;
  const diffKb    = diffText ? Math.round(diffText.length/1024) : 0;

  const di = diffInfoEl();
  if(di) { di.style.display='flex'; }
  if(diffTxtEl()) diffTxtEl().textContent = diffText
    ? `Diff fetched — ${diffLines.toLocaleString()} lines · ${diffKb} KB`
    : '⚠ No diff — check token permissions';

  // Initialise pipeline with all agents pending
  const agentMap = {};
  if(pipeEl()) pipeEl().innerHTML = renderLivePipeline(agentMap);

  // ── Try real backend ───────────────────────────────────────────────────────
  if(state.backendUrl) {
    try {
      const payload = {
        repo_url:    repoName(state.primaryRepo),
        source_ref:  target.source,
        target_ref:  target.target,
        change_type: target.changeType,
        diff_text:   diffText,
        llm_config:  getModelConfig(),
        metadata: { provider:state.provider, connected_repos:state.connectedRepos.map(repoName), diff_lines:diffLines, ...target.meta }
      };

      if(statusEl()) statusEl().textContent = 'Submitting to backend…';
      if(progEl())   progEl().style.width   = '10%';

      const submitResp = await fetch(state.backendUrl+'/api/v1/analyse', { method:'POST', headers, body:JSON.stringify(payload) });
      if(submitResp.status===401) throw new Error('Backend 401 — set SKIP_AUTH=true in .env');
      if(!submitResp.ok)          throw new Error(`Backend error ${submitResp.status}`);

      const { request_id: rid } = await submitResp.json();
      state.lastRequestId = rid;
      if(statusEl()) statusEl().textContent = 'Agents running…';
      if(progEl())   progEl().style.width   = '15%';

      // Progress poller — refreshes agent rows every 1.5 s
      let lastProg = {};
      const progTimer = setInterval(async () => {
        try {
          const pr = await fetch(state.backendUrl+'/api/v1/progress/'+rid, {headers});
          if(!pr.ok) return;
          const { agents } = await pr.json();
          agents.forEach(a => { lastProg[a.agent] = a; });

          const done     = Object.values(lastProg).filter(a=>a.status==='done'||a.status==='fallback').length;
          const running  = Object.values(lastProg).filter(a=>a.status==='running').length;
          const total    = AGENT_ORDER.length;
          const pct      = Math.round(15 + (done/total)*75);

          if(progEl())   progEl().style.width  = pct+'%';
          if(progPct())  progPct().textContent  = pct+'%';
          if(progLbl())  progLbl().textContent  = running
            ? `Running: ${agents.filter(a=>a.status==='running').map(a=>AGENT_META[a.agent]?.label||a.agent).join(', ')}`
            : done ? `${done}/${total} agents complete` : 'Agents initialising…';
          if(statusEl()) statusEl().textContent = `${done} of ${total} agents complete`;
          if(pipeEl())   pipeEl().innerHTML     = renderLivePipeline(lastProg);
        } catch(_) {}
      }, 1500);

      // Tick elapsed timers for running agents
      const tickTimer = setInterval(() => {
        document.querySelectorAll('[data-elapsed]').forEach(el => {
          const key   = el.dataset.elapsed;
          const entry = lastProg[key];
          if(entry && entry.status==='running' && entry.elapsed_s != null) {
            el.textContent = (entry.elapsed_s + (Date.now()-runStart)/1000 - (lastProg._pollAge||0)).toFixed(1)+'s';
          }
        });
      }, 200);

      // Report poller — checks for completed report every 2 s
      let report = null;
      for(let attempt=0; attempt<150; attempt++) {
        await new Promise(r=>setTimeout(r,2000));
        try {
          const poll = await fetch(state.backendUrl+'/api/v1/report/'+rid+'?fmt=full', {headers});
          if(poll.status===200) { report = await poll.json(); break; }
        } catch(_) {}
      }

      clearInterval(progTimer);
      clearInterval(tickTimer);
      clearInterval(clockTimer);

      if(report) {
        // Final progress snapshot before switching view
        try {
          const finalPr = await fetch(state.backendUrl+'/api/v1/progress/'+rid, {headers});
          if(finalPr.ok) {
            const { agents } = await finalPr.json();
            agents.forEach(a => { lastProg[a.agent] = a; });
            if(pipeEl()) pipeEl().innerHTML = renderLivePipeline(lastProg);
          }
        } catch(_) {}

        if(progEl())  progEl().style.width  = '100%';
        if(progPct()) progPct().textContent  = '100%';
        state.report = normalizeReport(report);
        saveHistory(state.report, target);
        await new Promise(r=>setTimeout(r,600));
        renderView('results');
        return;
      }
      throw new Error('Timed out waiting for report after 5 minutes');

    } catch(e) {
      clearInterval(clockTimer);
      const isNetwork = e.message==='Failed to fetch'||e.message.includes('NetworkError')||e.message.includes('CORS');
      if(!isNetwork) console.warn('Backend error:', e.message);
      if(isNetwork) {
        if(simHint()) simHint().innerHTML = `<span style="background:#fff8ec;border:1px solid #f59e0b;border-radius:7px;padding:6px 12px;color:#92400e;display:inline-flex;align-items:center;gap:6px"><i class="ti ti-info-circle"></i>Backend unreachable — switching to AI simulation</span>`;
      }
    }
  }

  // ── AI simulation fallback ─────────────────────────────────────────────────
  if(simHint()) simHint().innerHTML = `<span style="background:#fff8ec;border:1px solid #f59e0b;border-radius:7px;padding:6px 12px;color:#92400e;display:inline-flex;align-items:center;gap:6px"><i class="ti ti-info-circle"></i><strong>AI Simulation mode</strong> — no backend. Set SKIP_AUTH=true in .env to use the real pipeline.</span>`;

  // Simulate agents running one phase at a time
  const simPhases = [
    ['code_analysis','security'],
    ['ast_analysis','secrets_entropy','taint_analysis','iac_analysis','temporal_risk','schema_change'],
    ['dependency','test_coverage','interface','risk'],
    ['remediation'],
  ];
  let simTok = 0;
  for(const phase of simPhases) {
    // Mark all as running
    phase.forEach(k => { agentMap[k] = { status:'running', tokens:0, duration_s:0, elapsed_s:0 }; });
    if(pipeEl()) pipeEl().innerHTML = renderLivePipeline(agentMap);
    if(statusEl()) statusEl().textContent = `Running: ${phase.map(k=>AGENT_META[k]?.label||k).join(', ')}…`;

    const phaseDelay = 600 + Math.random()*600;
    await new Promise(r=>setTimeout(r,phaseDelay));

    // Mark each done with simulated stats
    phase.forEach(k => {
      const tok = k.includes('analysis')||k==='security'||k==='risk' ? 800+Math.floor(Math.random()*600) : 0;
      simTok += tok;
      agentMap[k] = { status: tok?'done':'fallback', tokens:tok, duration_s: parseFloat((phaseDelay/1000*(0.7+Math.random()*0.5)).toFixed(2)), elapsed_s:0, model: tok?'anthropic/claude-sonnet-4-6':'' };
    });
    if(pipeEl()) pipeEl().innerHTML = renderLivePipeline(agentMap);

    const done  = Object.values(agentMap).filter(a=>a.status==='done'||a.status==='fallback').length;
    const pct   = Math.round(10+(done/AGENT_ORDER.length)*80);
    if(progEl())  progEl().style.width  = pct+'%';
    if(progPct()) progPct().textContent  = pct+'%';
  }

  if(progEl())  progEl().style.width  = '92%';

  try {
    if(statusEl()) statusEl().textContent = 'Generating analysis with AI…';
    const r = await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ model:'claude-sonnet-4-20250514', max_tokens:1500,
        messages:[{role:'user',content:buildAnalysisPrompt(target, diffText)}] })
    });
    if(!r.ok) throw new Error('Anthropic API error: '+r.status);
    const d = await r.json();
    let text = (d.content&&d.content[0]&&d.content[0].text)||'{}';
    text = text.replace(/```json[\s\S]*?```|```[\s\S]*?```/g, m=>m.slice(m.indexOf('\n')+1,m.lastIndexOf('```'))).trim();
    if(text.startsWith('```')) text = text.replace(/^```\w*\n?/,'').replace(/```$/,'').trim();
    state.report = JSON.parse(text);
  } catch(e) {
    clearInterval(clockTimer);
    const el = document.getElementById('view-results');
    if(el) el.innerHTML = `<div class="err-msg" style="margin:20px"><i class="ti ti-alert-circle"></i><div><strong>Analysis failed:</strong> ${escHtml(e.message)}<br/><span style="font-size:11px;opacity:.8">Check your backend is running and ANTHROPIC_API_KEY is correct in .env</span></div></div><div style="display:flex;justify-content:flex-end;gap:8px;margin:0 20px"><button class="btn" onclick="showView('target')"><i class="ti ti-arrow-left"></i>Back</button><button class="btn btn-primary" onclick="state.report=null;renderView('results')"><i class="ti ti-refresh"></i>Retry</button></div>`;
    return;
  }

  clearInterval(clockTimer);
  saveHistory(state.report, target);
  if(progEl())  progEl().style.width  = '100%';
  if(progPct()) progPct().textContent  = '100%';
  await new Promise(r=>setTimeout(r,400));
  renderView('results');
}

function buildAnalysisTarget() {
  if(state.targetType==='pr'&&state.selectedPR) return { source:prHead(state.selectedPR), target:prBase(state.selectedPR), changeType:'pull_request', meta:{pr_id:prNum(state.selectedPR),pr_title:prTitle(state.selectedPR)} };
  if(state.targetType==='branch') return { source:state.sourceBranch, target:state.targetBranch, changeType:'branch_diff', meta:{} };
  return { source:state.commitSha, target:state.commitSha+'~1', changeType:'commit_diff', meta:{sha:state.commitSha} };
}

function buildAnalysisPrompt(target, diffText) {
  const rn   = repoName(state.primaryRepo);
  const conn = state.connectedRepos.map(shortName).join(', ') || 'none';

  // Trim diff to ~6000 chars for the prompt (keep most-changed files)
  const diffSnippet = diffText
    ? diffText.slice(0, 6000) + (diffText.length > 6000 ? '\n... (truncated)' : '')
    : '(no diff available — analyse based on repository name and target only)';

  const diffStats = diffText
    ? `${diffText.split('\n').filter(l=>l.startsWith('+')).length} additions, ${diffText.split('\n').filter(l=>l.startsWith('-')).length} deletions`
    : 'unknown';

  return `You are an expert code impact analysis engine. Analyse the following REAL git diff and produce a detailed, accurate impact analysis report.

Repository: ${rn}
Provider: ${state.provider}
Change: ${target.changeType} — ${target.source} → ${target.target}
Diff stats: ${diffStats}
Connected repos for blast radius: ${conn}

ACTUAL GIT DIFF:
\`\`\`diff
${diffSnippet}
\`\`\`

Analyse the REAL diff above carefully. Base ALL findings on what you actually see in the diff:
- Identify real security issues (hardcoded secrets, SQL injection, weak crypto, etc.)
- Flag real code quality issues from the changed lines
- Determine if dependency files changed
- Detect if API/interface files changed
- Assess real test coverage gaps
- Calculate realistic risk based on actual change size and content

Respond ONLY with a single JSON object (no markdown fences, no explanation):
{"gate_decision":"APPROVE","overall_risk":"low","risk_score":20,"rationale":"Concise 2-sentence rationale based on actual findings.","code_analysis":{"summary":"One sentence describing what this change actually does.","change_type":"feature","complexity_delta":1,"findings":[{"severity":"medium","description":"Specific issue found in the diff.","file":"actual/file/path.py"}]},"security":{"overall_severity":"low","secrets_detected":false,"findings":[]},"dependency":{"blast_radius_score":10,"affected_services":[],"changed_packages":[]},"test_coverage":{"coverage_delta":0,"regression_risk":"low","uncovered_paths":[]},"interface":{"breaking_changes":[]},"schema_change":{"has_destructive":false,"has_irreversible":false,"changes":[]},"risk":{"deployment_guidance":"One sentence on how to deploy.","rollback_feasibility":"easy","deployment_strategy":"standard"},"remediation":{"fix_suggestions":["Specific actionable fix based on actual diff findings"],"validation_checklist":["Specific test step for this change"],"executive_summary":"3-sentence non-technical summary of what changed and the risk level."},"token_usage":5000}

Use REAL file paths from the diff. If no security issues exist, return empty findings arrays. Be accurate — do not fabricate issues that aren't in the diff.`;
}

function normalizeReport(r) {
  /**
   * The backend ?fmt=full returns model_dump() of AnalysisReport:
   *   r.risk        = RiskResult dict  { overall_risk, risk_score, gate_decision, rationale, ... }
   *   r.remediation = RemediationResult dict { fix_suggestions, deployment_strategy, ... }
   *   r.code_analysis, r.security, r.dependency, r.test_coverage, r.interface — agent result dicts
   *   r.errors      = list of error strings
   *
   * The compact ?fmt=json summary uses different top-level keys:
   *   r.gate        = "APPROVE"/"HOLD"/"BLOCK"
   *   r.risk        = "low"/"medium"/"high"/"critical"   ← conflicts with full format!
   *
   * We detect which format we have and normalise into a single UI shape.
   */
  const isFull = r.code_analysis !== undefined || r.security !== undefined || r.errors !== undefined;

  // ── Gate decision ──────────────────────────────────────────────────────────
  let gate_decision, overall_risk, risk_score, rationale, riskObj, remObj;

  if(isFull) {
    // Full format: r.risk is a RiskResult object (or null)
    const rr = r.risk || {};
    gate_decision = rr.gate_decision || 'HOLD';
    overall_risk  = rr.overall_risk  || 'medium';
    risk_score    = rr.risk_score    || 0;
    rationale     = rr.rationale     || (r.errors && r.errors[0]) || '';
    riskObj = {
      deployment_guidance: rr.deployment_guidance || '',
      rollback_feasibility: rr.rollback_feasibility || '?',
      deployment_strategy: r.remediation?.deployment_strategy || 'standard',
    };
    remObj = r.remediation || null;
  } else {
    // Compact summary format: r.gate, r.risk are strings
    gate_decision = r.gate || r.gate_decision || 'HOLD';
    overall_risk  = r.risk || r.overall_risk  || 'medium';
    risk_score    = r.risk_score || 0;
    rationale     = r.rationale  || '';
    riskObj = { deployment_strategy: 'standard', rollback_feasibility: '?', deployment_guidance: '' };
    remObj  = null;
  }

  // ── Normalise security ─────────────────────────────────────────────────────
  const sec = r.security || null;
  const secNorm = sec ? {
    overall_severity: sec.overall_severity || 'low',
    secrets_detected: sec.secrets_detected || false,
    findings: (sec.findings || []).map(f => ({
      cwe: f.cwe_id || f.cwe || '',
      severity: f.severity || 'low',
      description: f.description || '',
      file: f.file_path || f.file || '',
      line_range: f.line_range || '',
    })),
  } : null;

  // ── Normalise code analysis ────────────────────────────────────────────────
  const ca = r.code_analysis || null;
  const caNorm = ca ? {
    summary: ca.summary || '',
    change_type: ca.change_type || 'unknown',
    complexity_delta: ca.complexity_delta || 0,
    findings: (ca.findings || []).map(f => ({
      severity: f.severity || 'low',
      description: f.description || '',
      file: f.file_path || f.file || '',
      line_range: f.line_range || '',
    })),
  } : null;

  // ── Normalise dependency ───────────────────────────────────────────────────
  const dep = r.dependency || null;
  const depNorm = dep ? {
    blast_radius_score: dep.blast_radius_score || 0,
    affected_services: dep.affected_services || [],
    changed_packages: dep.changed_packages || [],
  } : null;

  // ── Normalise test coverage ────────────────────────────────────────────────
  const tc = r.test_coverage || null;
  const tcNorm = tc ? {
    coverage_delta: tc.coverage_delta || 0,
    regression_risk: tc.regression_risk || 'low',
    uncovered_paths: (tc.uncovered_paths || []).map(u => ({
      file: u.file_path || u.file || '',
      description: u.suggested_test || u.description || u.uncovered_path || '',
    })),
  } : null;

  // ── Normalise interface ────────────────────────────────────────────────────
  const iface = r.interface || null;
  const ifaceNorm = iface ? {
    breaking_changes: (iface.breaking_changes || []).map(b => ({
      type: b.interface_type || b.type || 'REST',
      path: b.path || '',
      break_type: b.break_type || 'changed',
      severity: b.severity || 'high',
    })),
  } : null;

  // ── Normalise schema ───────────────────────────────────────────────────────
  const sc = r.schema_change || null;
  const scNorm = sc ? {
    has_destructive: sc.has_destructive || false,
    has_irreversible: sc.has_irreversible || false,
    changes: (sc.changes || []).map(c => ({
      change_type: c.change_type || 'alter',
      table: c.table_name || c.table || '',
      severity: c.severity || 'medium',
      reversible: c.reversible !== false,
    })),
  } : null;

  // ── Normalise remediation ──────────────────────────────────────────────────
  const remNorm = remObj ? {
    fix_suggestions: remObj.fix_suggestions || [],
    validation_checklist: remObj.validation_checklist || [],
    deployment_strategy: remObj.deployment_strategy || 'standard',
    executive_summary: remObj.executive_summary || '',
  } : null;

  // ── Phase 1b agents ────────────────────────────────────────────────────────
  const se = r.secrets_entropy || null;
  const seNorm = se ? {
    findings: (se.findings||[]).map(f=>({ variable:f.variable||'', value:f.value||'', kind:f.kind||'', entropy:f.entropy||0, severity:(f.severity||'low').toLowerCase(), line:f.line||0, file:f.file_path||'' })),
    high_entropy_count: se.high_entropy_count||0,
    known_prefix_count: se.known_prefix_count||0,
    overall_severity: (se.overall_severity||'low').toLowerCase(),
  } : null;

  const ast = r.ast_analysis || null;
  const astNorm = ast ? {
    findings: (ast.findings||[]).map(f=>({ function:f.function||'', kind:f.kind||'', severity:(f.severity||'low').toLowerCase(), description:f.description||'', suggestion:f.suggestion||'', line:f.line||0, file:f.file_path||'' })),
    avg_complexity: ast.avg_complexity||0,
    max_complexity: ast.max_complexity||0,
  } : null;

  const ta = r.taint_analysis || null;
  const taNorm = ta ? {
    taint_paths: (ta.taint_paths||[]).map(p=>({ source_var:p.source?.variable||'', source_kind:p.source?.source||'', source_file:p.source?.file_path||'', source_line:p.source?.line||0, sink_var:p.sink?.variable||'', sink_kind:p.sink?.sink||'', sink_file:p.sink?.file_path||'', sink_line:p.sink?.line||0, cwe:p.cwe||'', severity:(p.severity||'high').toLowerCase(), description:p.description||'' })),
    sources_found: ta.sources_found||0,
    sinks_found: ta.sinks_found||0,
    has_injection: ta.has_injection||false,
  } : null;

  const iac = r.iac_analysis || null;
  const iacNorm = iac ? {
    findings: (iac.findings||[]).map(f=>({ resource:f.resource||'', kind:f.kind||'', severity:(f.severity||'medium').toLowerCase(), description:f.description||'', cis_ref:f.cis_ref||'', file:f.file_path||'', line:f.line||0 })),
    overall_severity: (iac.overall_severity||'low').toLowerCase(),
  } : null;

  const tr = r.temporal_risk || null;
  const trNorm = tr ? {
    hot_files: (tr.hot_files||[]).map(f=>({ file_path:f.file_path||'', change_count:f.change_count||0, avg_risk_score:f.avg_risk_score||0 })),
    risk_trend: tr.risk_trend||'stable',
    escalating_pattern: tr.escalating_pattern||false,
    security_erosion: tr.security_erosion||false,
    change_fatigue: tr.change_fatigue||[],
  } : null;

  // ── Normalise QA scenarios ─────────────────────────────────────────────────
  const qar = r.qa_scenarios || null;
  const qaNorm = qar ? {
    scenarios: (qar.scenarios||[]).map(s => ({
      id:              s.id              || '',
      title:           s.title          || '',
      type:            s.type           || 'functional',
      priority:        s.priority       || 'medium',
      description:     s.description    || '',
      steps:           s.steps          || [],
      expected_result: s.expected_result|| '',
      affected_files:  s.affected_files || [],
      automation_hint: s.automation_hint|| '',
    })),
    total_scenarios: qar.total_scenarios || (qar.scenarios||[]).length,
    critical_count:  qar.critical_count  || 0,
    high_count:      qar.high_count      || 0,
    coverage_areas:  qar.coverage_areas  || [],
    summary:         qar.summary         || '',
  } : null;

  return {
    gate_decision,
    overall_risk,
    risk_score,
    rationale,
    code_analysis:    caNorm,
    security:         secNorm,
    secrets_entropy:  seNorm,
    ast_analysis:     astNorm,
    taint_analysis:   taNorm,
    iac_analysis:     iacNorm,
    temporal_risk:    trNorm,
    dependency:       depNorm,
    test_coverage:    tcNorm,
    interface:        ifaceNorm,
    schema_change:    scNorm,
    qa_scenarios:     qaNorm,
    risk:             riskObj,
    remediation:      remNorm,
    token_usage:    r.total_tokens || (Array.isArray(r.token_usage) ? r.token_usage.reduce((s,u)=>s+(u.tokens_used||0),0) : r.token_usage) || 0,
    duration_s:     r.duration_s || 0,
    agent_timings:  Array.isArray(r.agent_timings) ? r.agent_timings : [],
    errors:         r.errors || [],
  };
}

function saveHistory(report, target) {
  const entry = { id: Date.now(), ts: new Date().toISOString(), repo: repoName(state.primaryRepo), target: target.changeType+' '+target.source, gate: report.gate_decision, risk: report.overall_risk, score: report.risk_score };
  state.history.unshift(entry);
  if(state.history.length>50) state.history.length=50;
  localStorage.setItem('analysisHistory', JSON.stringify(state.history));
}

function resetAnalysis() { state.report=null; state.selectedPR=null; state.sourceBranch=''; state.commitSha=''; showView('configure'); }

async function submitToBackend() {
  if(!state.backendUrl) { alert('No backend URL configured. Go to Settings.'); return; }
  alert('Report is ready. In a real deployment, your backend would have already stored it when the analysis was run.\n\nBackend URL: '+state.backendUrl);
}

// ── REVIEW SUMMARY ────────────────────────────────────────────────────────────

let _reviewSummaryOpen = false;

function toggleReviewSummary() {
  const panel = document.getElementById('review-summary-panel');
  const btn   = document.getElementById('btn-review-summary');
  if (!panel) return;
  if (_reviewSummaryOpen) {
    panel.innerHTML = '';
    _reviewSummaryOpen = false;
    if (btn) btn.innerHTML = '<i class="ti ti-clipboard-text"></i>Review Summary';
    return;
  }
  _reviewSummaryOpen = true;
  if (btn) btn.innerHTML = '<i class="ti ti-x"></i>Close Summary';
  panel.innerHTML = buildReviewSummaryHTML(state.report);
}

function buildReviewSummaryHTML(r) {
  if (!r) return '';

  const esc = escHtml;
  const pct = v => Math.round((v||0)*100)+'%';

  // ── Gate banner ────────────────────────────────────────────────────────────
  const gateColor  = { APPROVE:'#0c7c4b', HOLD:'#8a5200', BLOCK:'#b81c1c' }[r.gate_decision] || '#7a8494';
  const gateIcon   = { APPROVE:'ti-circle-check', HOLD:'ti-alert-triangle', BLOCK:'ti-ban' }[r.gate_decision] || 'ti-help-circle';
  const riskColor  = { low:'#0c7c4b', medium:'#8a5200', high:'#b81c1c', critical:'#b81c1c' }[r.overall_risk] || '#7a8494';

  // ── Collect findings across all agents ────────────────────────────────────
  const secFindings   = r.security?.findings || [];
  const codeFindings  = r.code_analysis?.findings || [];
  const astFindings   = r.ast_analysis?.findings || [];
  const taintPaths    = r.taint_analysis?.taint_paths || [];
  const iacFindings   = r.iac_analysis?.findings || [];
  const entropyFinds  = r.secrets_entropy?.findings || [];
  const breakingChgs  = r.interface?.breaking_changes || [];
  const schemaChgs    = r.schema_change?.changes || [];
  const qaScenarios   = r.qa_scenarios?.scenarios || [];
  const fixSuggestions = r.remediation?.fix_suggestions || [];
  const checklist     = r.remediation?.validation_checklist || [];

  const sevRank = { critical:0, high:1, medium:2, low:3 };
  const sortBySev = arr => [...arr].sort((a,b) => (sevRank[a.severity?.toLowerCase()]??9) - (sevRank[b.severity?.toLowerCase()]??9));

  const sevBadge = (s) => {
    const c = {critical:'#b81c1c',high:'#8a5200',medium:'#1a6cf6',low:'#6b7280'}[s?.toLowerCase()]||'#6b7280';
    return `<span style="display:inline-block;padding:1px 7px;border-radius:10px;font-size:10px;font-weight:700;text-transform:uppercase;background:${c}18;color:${c};margin-right:6px;vertical-align:middle">${esc(s||'low')}</span>`;
  };

  const findingRow = (sev, text, file='') =>
    `<div style="display:flex;align-items:flex-start;gap:8px;padding:6px 0;border-bottom:1px solid #f0f2f5">
       ${sevBadge(sev)}
       <div style="flex:1;font-size:13px;color:#1a1f2e;line-height:1.5">${esc(text)}
         ${file?`<div style="font-size:11px;color:#9fadbf;font-family:'JetBrains Mono',monospace;margin-top:2px">${esc(file)}</div>`:''}
       </div>
     </div>`;

  const section = (icon, title, content, count, countColor='#7a8494') =>
    `<div style="margin-bottom:20px">
       <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;padding-bottom:6px;border-bottom:2px solid #f0f2f5">
         <i class="ti ${icon}" style="font-size:15px;color:${countColor}"></i>
         <span style="font-size:13px;font-weight:600;color:#0d1117">${title}</span>
         ${count!==null?`<span style="margin-left:auto;font-size:12px;font-weight:700;color:${countColor}">${count}</span>`:''}
       </div>
       ${content}
     </div>`;

  const emptyRow = (msg) => `<div style="font-size:12px;color:#9fadbf;padding:4px 0"><i class="ti ti-circle-check" style="color:#0c7c4b"></i> ${msg}</div>`;

  // ── Security section ───────────────────────────────────────────────────────
  const allSecRows = [
    ...sortBySev(secFindings).map(f => findingRow(f.severity, `${f.cwe?'['+f.cwe+'] ':''}${f.description}`, f.file)),
    ...sortBySev(entropyFinds).map(f => findingRow(f.severity, `Secret detected: ${f.kind||'unknown'} — ${f.variable||''}`, '')),
    ...sortBySev(taintPaths).map(t => findingRow(t.severity||'high', `Taint: ${t.source_var||'?'} → ${t.sink_var||'?'}${t.cwe?' ['+t.cwe+']':''} ${t.description||''}`, '')),
    ...sortBySev(iacFindings).map(f => findingRow(f.severity, `IaC: ${f.kind||''} on ${f.resource||''} — ${f.description}`, '')),
  ];
  const secContent = allSecRows.length
    ? allSecRows.join('')
    : emptyRow('No security issues detected');
  const secCriticalHigh = [...secFindings,...entropyFinds,...taintPaths,...iacFindings]
    .filter(f => ['critical','high'].includes((f.severity||'').toLowerCase())).length;

  // ── Code quality section ───────────────────────────────────────────────────
  const astRows = sortBySev(astFindings).map(f => findingRow(f.severity, `${f.kind||''}: ${f.function||''} — ${f.description}`, ''));
  const codeRows = sortBySev(codeFindings).map(f => findingRow(f.severity, f.description, f.file));
  const qualityContent = [...astRows,...codeRows].join('') || emptyRow('No code quality issues');
  const complexityDelta = r.code_analysis?.complexity_delta || 0;

  // ── Contracts & schema ─────────────────────────────────────────────────────
  const contractRows = sortBySev(breakingChgs).map(b => findingRow(b.severity, `${b.type||''} — ${(b.break_type||'').replace(/_/g,' ')} change`, b.path));
  const schemaRows   = sortBySev(schemaChgs).map(c => findingRow(c.severity, `${(c.change_type||'').replace(/_/g,' ')} on ${c.table||'?'} ${c.reversible===false?'(NOT reversible)':'(reversible)'}`, ''));
  const contractContent = [...contractRows,...schemaRows].join('') || emptyRow('No breaking changes or schema issues');
  const contractIssues  = breakingChgs.length + schemaChgs.length;

  // ── Dependencies ──────────────────────────────────────────────────────────
  const blastScore = r.dependency?.blast_radius_score || 0;
  const affectedSvcs = r.dependency?.affected_services || [];
  const depContent = `
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
      <div style="flex:1;height:8px;background:#f0f2f5;border-radius:4px;overflow:hidden">
        <div style="height:100%;width:${blastScore}%;background:${blastScore>70?'#b81c1c':blastScore>40?'#8a5200':'#0c7c4b'};border-radius:4px"></div>
      </div>
      <span style="font-size:13px;font-weight:700;color:${blastScore>70?'#b81c1c':blastScore>40?'#8a5200':'#0c7c4b'};min-width:48px;text-align:right">${blastScore}/100</span>
    </div>
    ${affectedSvcs.length ? `<div style="font-size:12px;color:#4b5563">Affected services: ${affectedSvcs.map(s=>`<span style="background:#fff3cd;padding:1px 6px;border-radius:8px;margin-right:4px">${esc(s)}</span>`).join('')}</div>` : ''}
    ${r.test_coverage?.coverage_delta!==undefined ? `<div style="font-size:12px;color:#4b5563;margin-top:6px">Test coverage delta: <strong style="color:${(r.test_coverage.coverage_delta||0)>=0?'#0c7c4b':'#b81c1c'}">${(r.test_coverage.coverage_delta||0)>0?'+':''}${parseFloat(r.test_coverage.coverage_delta||0).toFixed(1)}%</strong> &nbsp;·&nbsp; Regression risk: <strong>${r.test_coverage.regression_risk||'low'}</strong></div>` : ''}`;

  // ── QA scenarios summary ───────────────────────────────────────────────────
  const qaHighPlus = qaScenarios.filter(s => ['critical','high'].includes(s.priority?.toLowerCase()));
  const qaContent = qaHighPlus.length
    ? qaHighPlus.map(s =>
        `<div style="display:flex;align-items:flex-start;gap:8px;padding:6px 0;border-bottom:1px solid #f0f2f5">
           ${sevBadge(s.priority)}
           <div style="flex:1">
             <div style="font-size:13px;font-weight:500;color:#1a1f2e">${esc(s.title)}</div>
             <div style="font-size:11px;color:#9fadbf;margin-top:2px">${esc((s.type||'').replace(/_/g,' '))} · ${esc(s.id)}</div>
           </div>
         </div>`).join('') +
        (qaScenarios.length > qaHighPlus.length
          ? `<div style="font-size:12px;color:#9fadbf;padding-top:6px">+${qaScenarios.length-qaHighPlus.length} medium/low priority scenarios — see QA Scenarios tab</div>`
          : '')
    : emptyRow(`${qaScenarios.length} scenario(s) generated, none at critical/high priority`);

  // ── Remediation & checklist ────────────────────────────────────────────────
  const remContent = `
    ${r.remediation?.executive_summary
        ? `<p style="font-size:13px;color:#374151;line-height:1.7;margin-bottom:12px">${esc(r.remediation.executive_summary)}</p>` : ''}
    ${fixSuggestions.length ? `
      <div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:#9fadbf;margin-bottom:6px">Fixes required</div>
      ${fixSuggestions.slice(0,5).map(f => `<div style="font-size:13px;color:#1a1f2e;padding:4px 0;border-bottom:1px solid #f0f2f5">• ${esc(typeof f==='string'?f:f.description||JSON.stringify(f))}</div>`).join('')}
      ${fixSuggestions.length>5?`<div style="font-size:12px;color:#9fadbf;padding-top:4px">+${fixSuggestions.length-5} more — see Remediation tab</div>`:''}` : ''}
    ${checklist.length ? `
      <div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:#9fadbf;margin:10px 0 6px">Pre-release checklist</div>
      ${checklist.slice(0,6).map(c => `<div style="font-size:13px;color:#374151;padding:3px 0;display:flex;gap:6px;align-items:flex-start"><span style="color:#9fadbf;flex-shrink:0">☐</span>${esc(typeof c==='string'?c:c.item||JSON.stringify(c))}</div>`).join('')}
      ${checklist.length>6?`<div style="font-size:12px;color:#9fadbf;padding-top:4px">+${checklist.length-6} more items</div>`:''}` : ''}
    ${!fixSuggestions.length&&!checklist.length&&!r.remediation?.executive_summary ? emptyRow('No remediation steps required') : ''}`;

  // ── Markdown builder ───────────────────────────────────────────────────────
  function buildMarkdown() {
    const lines = [
      `## Impact Analysis Review — ${r.gate_decision}`,
      `**Risk:** ${(r.overall_risk||'').toUpperCase()}  |  **Score:** ${r.risk_score||0}/100  |  **Tokens:** ${(r.token_usage||0).toLocaleString()}`,
      '',
      `> ${r.rationale||''}`,
      '',
    ];

    const pushFindings = (title, items, fmt) => {
      if(!items.length) return;
      lines.push(`### ${title}`);
      items.forEach(f => lines.push(fmt(f)));
      lines.push('');
    };

    pushFindings('🔒 Security & Secrets',
      sortBySev([...secFindings,...entropyFinds]),
      f => `- **[${(f.severity||'low').toUpperCase()}]** ${f.cwe?'['+f.cwe+'] ':''}${f.description||f.kind||''}${f.file?' — `'+f.file+'`':''}`);

    pushFindings('🧬 Taint / Injection Paths',
      sortBySev(taintPaths),
      t => `- **[${(t.severity||'high').toUpperCase()}]** \`${t.source_var}\` → \`${t.sink_var}\`${t.cwe?' ['+t.cwe+']':''} — ${t.description||''}`);

    pushFindings('🏗️ IaC Security',
      sortBySev(iacFindings),
      f => `- **[${(f.severity||'medium').toUpperCase()}]** ${f.kind} on \`${f.resource}\` — ${f.description}`);

    pushFindings('⚙️ Code Quality (AST)',
      sortBySev(astFindings),
      f => `- **[${(f.severity||'medium').toUpperCase()}]** ${f.kind}: \`${f.function}\` — ${f.description}`);

    pushFindings('🔌 Breaking Changes',
      sortBySev(breakingChgs),
      b => `- **[${(b.severity||'high').toUpperCase()}]** ${b.type} — ${(b.break_type||'').replace(/_/g,' ')} \`${b.path}\``);

    pushFindings('🗄️ Schema Changes',
      sortBySev(schemaChgs),
      c => `- **[${(c.severity||'medium').toUpperCase()}]** ${(c.change_type||'').replace(/_/g,' ')} on \`${c.table}\` ${c.reversible===false?'⚠ NOT reversible':''}`);

    if(blastScore||affectedSvcs.length) {
      lines.push('### 📦 Dependencies');
      lines.push(`- Blast radius: **${blastScore}/100**`);
      if(affectedSvcs.length) lines.push(`- Affected services: ${affectedSvcs.map(s=>'`'+s+'`').join(', ')}`);
      lines.push('');
    }

    if(r.test_coverage?.coverage_delta!==undefined) {
      lines.push('### 🧪 Test Coverage');
      lines.push(`- Coverage delta: **${(r.test_coverage.coverage_delta||0)>0?'+':''}${parseFloat(r.test_coverage.coverage_delta||0).toFixed(1)}%** | Regression risk: **${r.test_coverage.regression_risk||'low'}**`);
      lines.push('');
    }

    if(qaHighPlus.length) {
      lines.push(`### 🧪 QA Scenarios (Critical/High — ${qaHighPlus.length} of ${qaScenarios.length})`);
      qaHighPlus.forEach(s => lines.push(`- **[${(s.priority||'').toUpperCase()}]** [${s.id}] ${s.title} *(${(s.type||'').replace(/_/g,' ')})*`));
      lines.push('');
    }

    if(r.remediation?.executive_summary) {
      lines.push('### 📋 Recommendation');
      lines.push(r.remediation.executive_summary);
      lines.push('');
    }
    if(fixSuggestions.length) {
      lines.push('#### Fixes Required');
      fixSuggestions.forEach(f => lines.push(`- [ ] ${typeof f==='string'?f:f.description||''}`));
      lines.push('');
    }
    if(checklist.length) {
      lines.push('#### Pre-release Checklist');
      checklist.forEach(c => lines.push(`- [ ] ${typeof c==='string'?c:c.item||''}`));
    }
    return lines.join('\n');
  }

  window._reviewMarkdown = buildMarkdown;

  // ── Assemble HTML ─────────────────────────────────────────────────────────
  return `
  <div class="card" style="margin-top:16px;border:2px solid ${gateColor}20">

    <!-- Gate banner -->
    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;padding:14px 18px;margin:-16px -16px 16px;background:${gateColor}0d;border-radius:var(--r) var(--r) 0 0;border-bottom:1px solid ${gateColor}30">
      <div style="display:flex;align-items:center;gap:12px">
        <i class="ti ${gateIcon}" style="font-size:28px;color:${gateColor}"></i>
        <div>
          <div style="font-size:18px;font-weight:800;color:${gateColor}">${r.gate_decision}</div>
          <div style="font-size:12px;color:#7a8494;margin-top:1px">Risk: <strong style="color:${riskColor}">${(r.overall_risk||'').toUpperCase()}</strong> &nbsp;·&nbsp; Score: <strong>${r.risk_score||0}/100</strong> &nbsp;·&nbsp; ${(r.token_usage||0).toLocaleString()} tokens</div>
        </div>
      </div>
      <button class="btn" onclick="copyReviewSummary(this)" style="font-size:12px"><i class="ti ti-clipboard"></i>Copy as Markdown</button>
    </div>

    ${r.rationale ? `<p style="font-size:13px;color:#374151;line-height:1.7;background:#f8f9fb;border-left:3px solid ${gateColor};padding:10px 14px;border-radius:0 6px 6px 0;margin-bottom:18px">${esc(r.rationale)}</p>` : ''}

    <!-- Two-column layout on wide screens -->
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:20px">

      <div>
        ${section('ti-shield-lock','Security & Secrets',secContent,
            secCriticalHigh ? secCriticalHigh+' critical/high' : 'clean',
            secCriticalHigh ? '#b81c1c' : '#0c7c4b')}

        ${section('ti-code','Code Quality',qualityContent,
            astFindings.length + codeFindings.length || null,
            complexityDelta > 5 ? '#8a5200' : '#7a8494')}

        ${section('ti-plug-connected','Contracts & Schema',contractContent,
            contractIssues || null,
            contractIssues ? '#8a5200' : '#7a8494')}
      </div>

      <div>
        ${section('ti-topology-star-3','Dependencies & Coverage',depContent, null)}

        ${section('ti-checklist','QA Scenarios',qaContent,
            `${qaScenarios.length} total`,
            qaHighPlus.length ? '#8a5200' : '#0c7c4b')}

        ${section('ti-speakerphone','Remediation',remContent, null)}
      </div>

    </div>
  </div>`;
}

async function copyReviewSummary(btn) {
  const md = window._reviewMarkdown ? window._reviewMarkdown() : '';
  try {
    await navigator.clipboard.writeText(md);
    const orig = btn.innerHTML;
    btn.innerHTML = '<i class="ti ti-check"></i>Copied!';
    btn.style.color = '#0c7c4b';
    setTimeout(() => { btn.innerHTML = orig; btn.style.color = ''; }, 2000);
  } catch(e) {
    prompt('Copy the Markdown below:', md);
  }
}

          <tr style="border-bottom:1px solid #f0f2f5"><td style="padding:5px 8px"><code>LLM_RETRY_ATTEMPTS</code></td><td style="padding:5px 8px;font-family:'JetBrains Mono',monospace">3</td><td style="padding:5px 8px">Max retries on rate-limit / transient LLM errors (uses exponential backoff + jitter)</td></tr>
          <tr style="border-bottom:1px solid #f0f2f5"><td style="padding:5px 8px"><code>LLM_RETRY_MAX_WAIT_S</code></td><td style="padding:5px 8px;font-family:'JetBrains Mono',monospace">60</td><td style="padding:5px 8px">Maximum wait (seconds) between retry attempts</td></tr>
          <tr style="border-bottom:1px solid #f0f2f5"><td style="padding:5px 8px"><code>WEBHOOK_DEDUP_TTL_S</code></td><td style="padding:5px 8px;font-family:'JetBrains Mono',monospace">300</td><td style="padding:5px 8px">How long (seconds) to remember a webhook delivery ID to suppress duplicates</td></tr>
          <tr><td style="padding:5px 8px"><code>QUALITY_RECALL_ALERT_THRESHOLD</code></td><td style="padding:5px 8px;font-family:'JetBrains Mono',monospace">0.0</td><td style="padding:5px 8px">Emit WARNING log + Slack alert when recall drops below this value (0 = disabled)</td></tr>
        </tbody>
      </table>
    </div>
  </div>`;
}

function saveSettings() {

  localStorage.setItem('backendUrl', state.backendUrl);
  localStorage.setItem('backendKey', state.backendKey);

  document.getElementById('settings-msg').textContent = 'Saved.';

async function testBackend() {
  const msg = document.getElementById('settings-msg');
  const url = document.getElementById('s-url').value.replace(/\/$/,'');
  msg.textContent = 'Testing...'; msg.style.color='#7a8494';
  try {
    const r = await fetch(url+'/health', { signal: AbortSignal.timeout(5000) });
    if(r.ok) {
      const d = await r.json();
      const llm = d.components?.llm;
      const llmStr = llm
        ? (llm.key_set ? ` · LLM: ${llm.provider}` : ' · ⚠ LLM key not set')
        : '';
      const status = d.status === 'ok' ? '✓ Connected' : `⚠ ${d.status}`;
      msg.textContent = status + llmStr;
      msg.style.color = d.status === 'ok' ? '#0c7c4b' : '#8a5200';
    } else throw new Error('HTTP '+r.status);
  } catch(e) { msg.textContent='✗ '+e.message; msg.style.color='#b81c1c'; }
}

// ── Human-in-the-loop review ──────────────────────────────────────────────────

let _pendingReviewDecision = '';  // 'APPROVED' | 'REJECTED'

function showHumanReviewModal(decision) {
  _pendingReviewDecision = decision;
  const modal = document.getElementById('review-modal');
  if (!modal) return;

  const title = document.getElementById('modal-title');
  const sub   = document.getElementById('modal-sub');
  const btn   = document.getElementById('modal-submit-btn');

  if (decision === 'APPROVED') {
    title.textContent = 'Approve Deployment';
    title.style.color = '#0c7c4b';
    if (sub) sub.textContent = 'You are approving this deployment despite the HOLD/BLOCK gate. This decision is permanently logged.';
    if (btn) { btn.className = 'btn btn-success'; btn.textContent = 'Confirm Approval'; }
    // Highlight approve button
    const ap = document.getElementById('btn-approve-panel');
    const rj = document.getElementById('btn-reject-panel');
    if (ap) ap.style.border = '2px solid #0c7c4b';
    if (rj) rj.style.border = '1px solid #e8eaed';
  } else {
    title.textContent = 'Reject Deployment';
    title.style.color = '#b81c1c';
    if (sub) sub.textContent = 'You are explicitly rejecting this deployment. This creates an audit record and notifies the team.';
    if (btn) { btn.className = 'btn btn-danger'; btn.textContent = 'Confirm Rejection'; }
    const ap = document.getElementById('btn-approve-panel');
    const rj = document.getElementById('btn-reject-panel');
    if (rj) rj.style.border = '2px solid #b81c1c';
    if (ap) ap.style.border = '1px solid #e8eaed';
  }

  modal.style.display = 'flex';
  setTimeout(() => { const nameInput = document.getElementById('reviewer-name'); if (nameInput) nameInput.focus(); }, 100);
}

function closeReviewModal() {
  const modal = document.getElementById('review-modal');
  if (modal) modal.style.display = 'none';
  _pendingReviewDecision = '';
}

async function submitHumanReview() {
  const name   = (document.getElementById('reviewer-name')?.value || '').trim();
  const reason = (document.getElementById('reviewer-reason')?.value || '').trim();
  const notes  = (document.getElementById('reviewer-notes')?.value || '').trim();

  if (!name)   { alert('Reviewer name is required.'); return; }
  if (!reason || reason.length < 10) { alert('Reason must be at least 10 characters.'); return; }

  const btn = document.getElementById('modal-submit-btn');
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spinner" style="width:14px;height:14px;border-width:2px;margin-right:6px"></span>Submitting…'; }

  // Save review locally first (always works)
  const reviewRecord = {
    decision:    _pendingReviewDecision,
    reviewer:    name,
    reason,
    notes,
    timestamp:   new Date().toISOString(),
    request_id:  state.lastRequestId || '',
    gate:        state.report?.gate_decision || state.report?.gate || '',
  };

  // Attempt to send to backend gate override endpoint
  let backendSuccess = false;
  if (state.backendUrl && state.lastRequestId) {
    try {
      const headers = { 'Content-Type': 'application/json' };
      if (state.backendKey) headers['X-API-Key'] = state.backendKey;

      const override_to = _pendingReviewDecision === 'APPROVED' ? 'APPROVE' : 'BLOCK';
      const resp = await fetch(`${state.backendUrl}/api/v1/gate/${state.lastRequestId}/override`, {
        method:  'POST',
        headers,
        body:    JSON.stringify({ override_to, reason: `[${_pendingReviewDecision}] ${reason} — ${name}${notes ? ' | Notes: ' + notes : ''}` }),
      });

      if (resp.ok) {
        backendSuccess = true;
      } else {
        const errData = await resp.json().catch(() => ({}));
        console.warn('Gate override backend error:', errData);
      }
    } catch (e) {
      console.warn('Gate override request failed (stored locally):', e.message);
    }
  }

  // Update UI to show decision
  closeReviewModal();
  _applyReviewDecisionToUI(reviewRecord, backendSuccess);
}

function _applyReviewDecisionToUI(review, backendSaved) {
  const panel = document.getElementById('human-review-panel');
  if (!panel) return;

  const isApproved = review.decision === 'APPROVED';
  const color = isApproved ? '#0c7c4b' : '#b81c1c';
  const bgColor = isApproved ? '#edfaf3' : '#fff1f1';
  const icon  = isApproved ? 'ti-circle-check' : 'ti-ban';
  const label = isApproved ? 'Approved by reviewer' : 'Rejected by reviewer';

  panel.style.background  = bgColor;
  panel.style.borderColor = color;
  panel.innerHTML = `
    <div style="display:flex;align-items:center;gap:12px">
      <div style="width:40px;height:40px;border-radius:10px;background:${isApproved ? '#0c7c4b' : '#b81c1c'};display:flex;align-items:center;justify-content:center;flex-shrink:0">
        <i class="ti ${icon}" style="font-size:20px;color:#fff"></i>
      </div>
      <div style="flex:1">
        <div style="font-size:15px;font-weight:700;color:${color};font-family:'Instrument Serif',serif">${label}</div>
        <div style="font-size:12px;color:#7a8494;margin-top:2px">By <strong>${escHtml(review.reviewer)}</strong> at ${new Date(review.timestamp).toLocaleString()}</div>
      </div>
      ${backendSaved ? '<span style="font-size:11px;background:#edfaf3;color:#0c7c4b;border:1px solid #b5e8cf;border-radius:12px;padding:2px 8px">✓ Audit logged</span>' : '<span style="font-size:11px;background:#fff8ec;color:#8a5200;border:1px solid #fad98a;border-radius:12px;padding:2px 8px">⚠ Locally saved</span>'}
    </div>
    <div style="margin-top:12px;padding:10px 13px;background:rgba(0,0,0,.03);border-radius:8px;font-size:13px;color:#3d4652;line-height:1.5">
      <strong>Reason:</strong> ${escHtml(review.reason)}
      ${review.notes ? `<br><strong>Notes:</strong> ${escHtml(review.notes)}` : ''}
    </div>
    <div style="margin-top:10px;font-size:11px;color:#9fadbf;display:flex;align-items:center;gap:5px">
      <i class="ti ti-shield-lock"></i>
      Decision recorded. Request ID: <code style="font-size:10px">${escHtml(review.request_id||'—')}</code>
    </div>`;

  // Also update the gate banner color to reflect human decision
  const banner = document.querySelector('.gate-banner');
  if (banner && isApproved) {
    banner.className = 'gate-banner gate-approve';
    const title = banner.querySelector('.gate-title');
    if (title) title.innerHTML = title.innerHTML.replace(/HOLD|BLOCK/, 'APPROVED (override)');
    const icon2 = banner.querySelector('.gate-icon');
    if (icon2) { icon2.className = 'ti ti-circle-check gate-icon'; }
  }
}

// ── Backend proxy API helper ───────────────────────────────────────────────────

function _gitConfig() {
  /** Build the GitConfig payload from current state for proxy calls */
  return {
    provider:  state.provider,
    base_url:  state.baseUrl || '',
    auth_mode: state.authMode,
    token:     state.token || '',
    username:  state.username || '',
    password:  state.password || '',
    workspace: state.workspace || '',
  };
}

async function _proxyPost(path, body, opts = {}) {
  /** POST to the backend git proxy. Returns parsed JSON. */
  if (!state.backendUrl) throw new Error('Backend URL not configured. Go to Settings.');
  const headers = { 'Content-Type': 'application/json' };
  if (state.backendKey) headers['X-API-Key'] = state.backendKey;
  const r = await fetch(`${state.backendUrl}${path}`, {
    method: 'POST', headers, body: JSON.stringify(body),
    signal: AbortSignal.timeout(opts.timeout || 30000),
  });
  if (!r.ok) {
    const err = await r.json().catch(() => ({ detail: r.statusText }));
    throw new Error(err.detail || `HTTP ${r.status}`);
  }
  return r.json();
}

// ── Helper function overrides for proxy-based architecture ─────────────────────

function repoName(r) { return r ? (r.full_name || r.slug || r.name || '') : ''; }
function shortName(r) { const n = repoName(r); return n.includes('/') ? n.split('/')[1] : n; }
function repoLang(r)  { return r ? (r.language || '') : ''; }

function prNum(p)    { return `#${p.number || p.id}`; }
function prTitle(p)  { return p.title || ''; }
function prHead(p)   { return (p.head?.ref) || (p.source?.branch?.name) || ''; }
function prBase(p)   { return (p.base?.ref) || (p.destination?.branch?.name) || ''; }
function prAuthor(p) { return p.user?.login || p.author?.login || p.author?.display_name || p.author?.nickname || ''; }
function branchName(b) { return b.name || ''; }

function commitSha(c) {
  const sha = c.sha || c.hash || c.id || '';
  return sha.slice(0, 7);
}
function commitMsg(c) {
  return c.commit?.message || c.message || '';
}
function commitAuthor(c) {
  return c.commit?.author?.name || c.author?.login || c.author?.user?.display_name || c.author?.raw || '';
}
function escHtml(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
const esc = escHtml;
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

function updateConnIndicator(ok, name) {
  const dot = document.getElementById('conn-dot');
  const txt = document.getElementById('conn-text');
  if (dot) dot.className = 'conn-dot' + (ok ? ' live' : '');

async function runJudgePanel() {
  const el = document.getElementById('judge-panel-results');
  if(!el) return;

  if(!state.backendUrl || !state.lastRequestId) {
    el.innerHTML = `<div class="info-msg" style="margin-top:14px"><i class="ti ti-info-circle"></i>Judge panel requires a connected backend. Run analysis via backend first, then click here.</div>`;
    return;
  }

  el.innerHTML = `<div class="card" style="margin-top:14px">
    <div class="card-title"><i class="ti ti-gavel"></i>LLM Judge Panel</div>
    <div style="display:flex;align-items:center;gap:10px;color:#7a8494;font-size:13px"><span class="spinner"></span>Running 3 independent judges in parallel…</div>
  </div>`;

  const headers = {'Content-Type':'application/json'};
  if(state.backendKey) headers['X-API-Key'] = state.backendKey;

  try {
    const resp = await fetch(state.backendUrl+'/api/v1/evaluate/'+state.lastRequestId, {
      method: 'POST',
      headers,
      body: JSON.stringify({ diff_text: state.diffText || '', async_mode: false }),
    });
    if(!resp.ok) throw new Error('HTTP '+resp.status);
    const data = await resp.json();
    el.innerHTML = renderJudgePanelResults(data);
  } catch(e) {
    el.innerHTML = `<div class="err-msg" style="margin-top:14px"><i class="ti ti-alert-circle"></i>Judge panel failed: ${escHtml(e.message)}</div>`;
  }
}

function renderJudgePanelResults(data) {
  const verdictColor  = { PASS:'#0c7c4b', PARTIAL:'#8a5200', FAIL:'#b81c1c' };
  const verdictBg     = { PASS:'#edfaf3', PARTIAL:'#fff8ec', FAIL:'#fff1f1' };
  const verdictBorder = { PASS:'#b5e8cf', PARTIAL:'#fad98a', FAIL:'#f8c0c0' };
  const confColor     = { HIGH:'#0c7c4b', MEDIUM:'#8a5200', LOW:'#b81c1c' };

  const vc  = verdictColor[data.overall_verdict]  || '#7a8494';
  const vb  = verdictBg[data.overall_verdict]     || '#f7f8fa';
  const vbr = verdictBorder[data.overall_verdict] || '#e8eaed';

  const agentRows = (data.agent_verdicts||[]).map(v => {
    const col = verdictColor[v.verdict]  || '#7a8494';
    const bg  = verdictBg[v.verdict]    || '#f7f8fa';
    const br  = verdictBorder[v.verdict]|| '#e8eaed';
    return `<div style="padding:10px 14px;border:1px solid #e8eaed;border-radius:8px;margin-bottom:6px;background:#fff">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <span style="font-size:12px;font-weight:600;color:#0d1117;min-width:120px">${escHtml((v.agent_name||'').replace(/_/g,' '))}</span>
        <span style="font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px;background:${bg};color:${col};border:1px solid ${br}">${v.verdict}</span>
        <span style="font-size:11px;color:#7a8494">confidence: <strong style="color:${confColor[v.confidence]||'#7a8494'}">${v.confidence||'—'}</strong></span>
        <span style="font-size:13px;font-weight:700;font-family:'JetBrains Mono',monospace;color:#0d1117;margin-left:auto">${(v.overall_score||0).toFixed(1)}<span style="font-size:10px;font-weight:400;color:#9fadbf">/5</span></span>
      </div>
      ${v.summary?`<div style="font-size:12px;color:#7a8494;margin-top:6px;line-height:1.5">${escHtml(v.summary)}</div>`:''}
      ${(v.consensus_missed||[]).length?`<div style="font-size:11px;color:#b81c1c;margin-top:5px"><i class="ti ti-alert-triangle" style="font-size:12px;margin-right:3px"></i>Missed: ${v.consensus_missed.map(m=>`<code>${escHtml(m)}</code>`).join(' · ')}</div>`:''}
      ${(v.disagreements||[]).length?`<div style="font-size:11px;color:#8a5200;margin-top:4px"><i class="ti ti-arrows-diff" style="font-size:12px;margin-right:3px"></i>${escHtml(v.disagreements.join(' · '))}</div>`:''}
    </div>`;
  }).join('');

  const gaps = data.critical_gaps || [];

  return `<div class="card" style="margin-top:14px">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px">
      <div class="card-title" style="margin-bottom:0"><i class="ti ti-gavel"></i>LLM Judge Panel</div>
      <div style="display:flex;align-items:center;gap:8px">
        <span style="font-size:11px;color:#7a8494">${data.panel_size||3} judges · ${(data.agent_verdicts||[]).length} agents</span>
        <span style="font-size:13px;font-weight:700;font-family:'JetBrains Mono',monospace">${(data.overall_score||0).toFixed(2)}<span style="font-size:10px;font-weight:400;color:#9fadbf">/5</span></span>
        <span style="font-size:12px;font-weight:600;padding:3px 10px;border-radius:12px;background:${vb};color:${vc};border:1px solid ${vbr}">${data.overall_verdict||'—'}</span>
      </div>
    </div>
    ${gaps.length?`<div style="padding:8px 12px;background:#fff1f1;border:1px solid #f8c0c0;border-radius:7px;margin-bottom:12px;font-size:12px;color:#b81c1c"><strong>Critical gaps (consensus missed):</strong> ${gaps.map(g=>`<code>${escHtml(g)}</code>`).join(' · ')}</div>`:''}
    ${agentRows}
    <div style="font-size:11px;color:#9fadbf;margin-top:10px;display:flex;align-items:center;gap:5px"><i class="ti ti-info-circle"></i>Scores: completeness · precision · severity accuracy · specificity (each 1–5)</div>
  </div>`;
}

// ── Quality Metrics view ──────────────────────────────────────────────────────
function renderQuality(el) {
  const savedThreshold = parseFloat(localStorage.getItem('qualityRecallThreshold') || '0');
  el.innerHTML = `
  <div style="max-width:860px">
    <div class="card">
      <div class="card-title"><i class="ti ti-target-arrow"></i>Detection quality — recall &amp; precision</div>
      <p style="font-size:13px;color:#7a8494;margin-bottom:16px;line-height:1.6">
        Runs all 8 golden-diff test cases through the static detection layer and measures how many
        known issues each agent finds (<strong>recall</strong>) and how many false alarms it raises
        (<strong>precision</strong>). Results are appended to a JSONL log so regressions are visible over time.
      </p>
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px">
        ${state.backendUrl
          ? `<button class="btn btn-primary" onclick="runQualityCheck()" id="btn-quality-run"><i class="ti ti-player-play"></i>Run quality check</button>`
          : `<div class="info-msg"><i class="ti ti-info-circle"></i>Backend required — configure it in Settings.</div>`
        }
        ${state.backendUrl ? `<button class="btn" onclick="loadQualitySummary()" id="btn-quality-load"><i class="ti ti-refresh"></i>Load last run</button>` : ''}
      </div>
      <div style="display:flex;align-items:center;gap:8px;padding-top:10px;border-top:1px solid #f0f2f5">
        <i class="ti ti-bell" style="color:#9fadbf;font-size:14px"></i>
        <label style="font-size:12px;color:#7a8494;white-space:nowrap">Alert threshold (recall %)</label>
        <input type="number" id="quality-threshold" min="0" max="100" step="1"
          value="${Math.round(savedThreshold*100)}"
          style="width:70px;padding:4px 8px;border:1px solid #d1d5db;border-radius:6px;font-size:12px"
          oninput="saveQualityThreshold(this.value)"
          placeholder="0"/>
        <span style="font-size:11px;color:#9fadbf">0 = disabled · also set <code>QUALITY_RECALL_ALERT_THRESHOLD</code> on the backend for Slack alerts</span>
      </div>
    </div>
    <div id="quality-results"></div>
  </div>`;

  if(state.backendUrl) loadQualitySummary();
}

function saveQualityThreshold(val) {
  const pct = Math.max(0, Math.min(100, parseInt(val) || 0));
  localStorage.setItem('qualityRecallThreshold', (pct / 100).toFixed(2));
  // Re-render results if already loaded
  const res = document.getElementById('quality-results');
  if(res && res.dataset.lastData) {
    try { renderQualityData(JSON.parse(res.dataset.lastData), res); } catch(_) {}
  }
}

async function runQualityCheck() {
  const btn = document.getElementById('btn-quality-run');
  const res = document.getElementById('quality-results');
  if(btn) { btn.disabled=true; btn.innerHTML='<span class="spinner" style="width:14px;height:14px;border-width:2px"></span> Running…'; }
  if(res) res.innerHTML = `<div class="card"><div style="display:flex;align-items:center;gap:10px;color:#7a8494;font-size:13px"><span class="spinner"></span>Running 8 golden cases through static detection…</div></div>`;
  const headers = {'Content-Type':'application/json'};
  if(state.backendKey) headers['X-API-Key'] = state.backendKey;
  try {
    const r = await fetch(state.backendUrl+'/api/v1/quality/run', {method:'POST', headers});
    if(!r.ok) throw new Error('HTTP '+r.status);
    renderQualityData(await r.json(), res);
  } catch(e) {
    if(res) res.innerHTML = `<div class="err-msg"><i class="ti ti-alert-circle"></i>Quality run failed: ${escHtml(e.message)}</div>`;
  } finally {
    if(btn) { btn.disabled=false; btn.innerHTML='<i class="ti ti-player-play"></i>Run quality check'; }
  }
}

async function loadQualitySummary() {
  const btn = document.getElementById('btn-quality-load');
  const res = document.getElementById('quality-results');
  if(btn) btn.disabled = true;
  const headers = {};
  if(state.backendKey) headers['X-API-Key'] = state.backendKey;
  try {
    const r = await fetch(state.backendUrl+'/api/v1/quality/summary', {headers});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const data = await r.json();
    if(data.runs === 0) {
      if(res) res.innerHTML = `<div class="info-msg"><i class="ti ti-info-circle"></i>No quality runs logged yet. Click <strong>Run quality check</strong> to generate the first snapshot.</div>`;
    } else {
      renderQualityData(data, res);
    }
  } catch(e) {
    if(res) res.innerHTML = `<div class="info-msg"><i class="ti ti-info-circle"></i>No history yet — run a quality check first.</div>`;
  } finally {
    if(btn) btn.disabled = false;
  }
}

function renderQualityData(data, el) {
  if(!el) return;
  el.dataset.lastData = JSON.stringify(data);

  const threshold = parseFloat(localStorage.getItem('qualityRecallThreshold') || '0');
  const recall    = data.overall_recall || 0;
  const thresholdBadge = threshold > 0
    ? (recall >= threshold
        ? `<span style="display:inline-flex;align-items:center;gap:4px;padding:2px 8px;background:#e6f4ee;color:#0c7c4b;border-radius:10px;font-size:11px;font-weight:600"><i class="ti ti-check"></i>Above threshold (${Math.round(threshold*100)}%)</span>`
        : `<span style="display:inline-flex;align-items:center;gap:4px;padding:2px 8px;background:#fde8e8;color:#b81c1c;border-radius:10px;font-size:11px;font-weight:600"><i class="ti ti-alert-triangle"></i>Below threshold (${Math.round(threshold*100)}%)</span>`)
    : '';

  const pct = v => `${Math.round((v||0)*100)}%`;
  const scoreColor = v => v>=0.9?'#0c7c4b':v>=0.7?'#8a5200':'#b81c1c';
  const scoreBar   = v => `<div style="height:5px;background:#f0f2f5;border-radius:3px;overflow:hidden;margin-top:4px"><div style="height:100%;width:${Math.round((v||0)*100)}%;background:${scoreColor(v)};border-radius:3px"></div></div>`;

  const byAgent = data.by_agent || {};
  const agentRows = Object.entries(byAgent).map(([name, m]) => `
    <tr style="border-bottom:1px solid #e8eaed">
      <td style="padding:10px 12px;font-size:13px;font-weight:500;white-space:nowrap">${escHtml(name.replace(/_/g,' '))}</td>
      <td style="padding:10px 16px;text-align:right;min-width:90px"><div style="font-size:13px;font-weight:700;font-family:'JetBrains Mono',monospace;color:${scoreColor(m.recall)}">${pct(m.recall)}</div>${scoreBar(m.recall)}</td>
      <td style="padding:10px 16px;text-align:right;min-width:90px"><div style="font-size:13px;font-weight:700;font-family:'JetBrains Mono',monospace;color:${scoreColor(m.precision)}">${pct(m.precision)}</div>${scoreBar(m.precision)}</td>
      <td style="padding:10px 16px;text-align:right;min-width:90px"><div style="font-size:13px;font-weight:700;font-family:'JetBrains Mono',monospace;color:${scoreColor(m.f1)}">${pct(m.f1)}</div>${scoreBar(m.f1)}</td>
      <td style="padding:10px 12px;text-align:center;font-size:12px;font-family:'JetBrains Mono',monospace;color:#0c7c4b;font-weight:600">${m.tp}</td>
      <td style="padding:10px 12px;text-align:center;font-size:12px;font-family:'JetBrains Mono',monospace;color:#b81c1c;font-weight:600">${m.fp}</td>
      <td style="padding:10px 12px;text-align:center;font-size:12px;font-family:'JetBrains Mono',monospace;color:#8a5200;font-weight:600">${m.fn}</td>
    </tr>`).join('');

  const byCaseRows = (data.by_case||[]).map(c => `
    <tr style="border-bottom:1px solid #e8eaed">
      <td style="padding:8px 12px;font-size:12px;font-family:'JetBrains Mono',monospace;color:#1a6cf6">${escHtml(c.case_id)}</td>
      <td style="padding:8px 12px;text-align:right;font-size:12px;font-weight:600;color:${scoreColor(c.recall)}">${pct(c.recall)}</td>
      <td style="padding:8px 12px;text-align:right;font-size:12px;font-weight:600;color:${scoreColor(c.precision)}">${pct(c.precision)}</td>
    </tr>`).join('');

  const ts = data.latest_timestamp || data.timestamp || '';
  const tsStr = ts ? `Last run: ${new Date(ts).toLocaleString()}` : '';

  el.innerHTML = `
  <div class="card">
    <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px">
      <div class="card-title" style="margin-bottom:0"><i class="ti ti-chart-bar"></i>By agent</div>
      <div style="text-align:right">
        ${tsStr?`<div style="font-size:11px;color:#9fadbf;margin-bottom:4px">${escHtml(tsStr)}${data.runs>1?' · '+data.runs+' runs logged':''}</div>`:''}
        <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:flex-end">
          <div style="display:flex;gap:16px;font-size:12px">
            <span>Recall: <strong style="font-family:'JetBrains Mono',monospace;color:${scoreColor(data.overall_recall||0)}">${pct(data.overall_recall||0)}</strong></span>
            <span>Precision: <strong style="font-family:'JetBrains Mono',monospace;color:${scoreColor(data.overall_precision||0)}">${pct(data.overall_precision||0)}</strong></span>
          </div>
          ${thresholdBadge}
        </div>
      </div>
    </div>
    <div style="overflow-x:auto">
    <table style="width:100%;border-collapse:collapse">
      <thead><tr style="font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#9fadbf;border-bottom:2px solid #e8eaed">
        <th style="padding:8px 12px;text-align:left;font-weight:500">Agent</th>
        <th style="padding:8px 16px;text-align:right;font-weight:500">Recall</th>
        <th style="padding:8px 16px;text-align:right;font-weight:500">Precision</th>
        <th style="padding:8px 16px;text-align:right;font-weight:500">F1</th>
        <th style="padding:8px 12px;text-align:center;font-weight:500;color:#0c7c4b" title="True positives">TP</th>
        <th style="padding:8px 12px;text-align:center;font-weight:500;color:#b81c1c" title="False positives">FP</th>
        <th style="padding:8px 12px;text-align:center;font-weight:500;color:#8a5200" title="False negatives">FN</th>
      </tr></thead>
      <tbody>${agentRows}</tbody>
    </table>
    </div>
  </div>
  ${byCaseRows ? `<div class="card">
    <div class="card-title" style="margin-bottom:14px"><i class="ti ti-list-check"></i>By golden case</div>
    <table style="width:100%;border-collapse:collapse">
      <thead><tr style="font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#9fadbf;border-bottom:2px solid #e8eaed">
        <th style="padding:8px 12px;text-align:left;font-weight:500">Case</th>
        <th style="padding:8px 12px;text-align:right;font-weight:500">Recall</th>
        <th style="padding:8px 12px;text-align:right;font-weight:500">Precision</th>
      </tr></thead>
      <tbody>${byCaseRows}</tbody>
    </table>
  </div>` : ''}`;
}

// ── Init ──────────────────────────────────────────────────────────────────────
const bdEl = document.getElementById('backend-url-display');
if (bdEl) bdEl.textContent = state.backendUrl ? '⚡ ' + state.backendUrl : '';
showView('configure');

</script>
</body>
</html>
